<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06325e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Pescar.ro" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/favicon-64.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <title>Pescar.ro</title>
  
<style>
  :root {
    --bg: #f3f7fa;
    --surface: #ffffff;
    --surface-soft: #eef5f8;
    --surface-blue: #eaf5fb;
    --ink: #081b2d;
    --muted: #738295;
    --blue: #075f98;
    --blue-dark: #073c63;
    --cyan: #0aa6c8;
    --green: #188856;
    --red: #d13d48;
    --amber: #d68a15;
    --line: rgba(8, 27, 45, .075);
    --shadow: 0 10px 30px rgba(7, 35, 61, .075);
    --shadow-strong: 0 20px 48px rgba(7, 42, 75, .15);
    --topbar-h: 68px;
    --nav-h: 72px;
    --radius: 20px;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
  }

  body {
    overflow-x: hidden;
    overscroll-behavior-y: none;
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
    touch-action: manipulation;
  }

  button {
    border: 0;
    cursor: pointer;
  }

  button:active,
  .feed-card:active,
  .partner-card:active,
  .guide-card:active,
  .menu-item:active {
    transform: scale(.985);
  }

  img {
    display: block;
    max-width: 100%;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  .hide {
    display: none !important;
  }

  .muted {
    color: var(--muted);
  }

  .app {
    min-height: 100dvh;
    background:
      radial-gradient(circle at 80% -10%, rgba(10, 166, 200, .10), transparent 28%),
      linear-gradient(180deg, #f8fbfd 0%, var(--bg) 60%, #eef4f7 100%);
  }

  .screen {
    width: 100%;
    max-width: 620px;
    margin: 0 auto;
    padding:
      calc(var(--topbar-h) + env(safe-area-inset-top) + 12px)
      12px
      calc(var(--nav-h) + env(safe-area-inset-bottom) + 22px);
  }

  .center {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 22px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .stack {
    display: grid;
    gap: 9px;
  }

  .grid2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
  }

  .form-grid {
    display: grid;
    gap: 10px;
  }

  #splash {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 50% 15%, rgba(10, 166, 200, .14), transparent 30%),
      #f6fafc;
    transition: opacity .16s ease;
  }

  .splash-card {
    width: min(76vw, 430px);
    background: transparent;
  }

  .splash-logo {
    width: 100%;
    filter: drop-shadow(0 12px 24px rgba(7, 48, 80, .10));
  }

  .loader-line {
    width: 48%;
    height: 3px;
    margin: 18px auto 0;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(7, 95, 152, .10);
  }

  .loader-line span {
    display: block;
    width: 42%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--blue), var(--cyan));
    animation: loader 1s linear infinite;
  }

  @keyframes loader {
    from { transform: translateX(-120%); }
    to { transform: translateX(250%); }
  }

  .netbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding: calc(env(safe-area-inset-top) + 8px) 12px 8px;
    background: #071c2e;
    color: #fff;
    text-align: center;
    font-size: 12px;
    font-weight: 850;
  }

  .topbar {
    position: fixed;
    inset: 0 0 auto;
    z-index: 40;
    height: calc(var(--topbar-h) + env(safe-area-inset-top));
    padding-top: env(safe-area-inset-top);
    background: rgba(248, 251, 253, .94);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(8, 27, 45, .045);
  }

  .topbar-inner {
    width: 100%;
    max-width: 620px;
    height: var(--topbar-h);
    margin: 0 auto;
    padding: 0 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    padding: 0;
    background: transparent;
  }

  .brand-logo {
    width: 106px;
    max-height: 42px;
    object-fit: contain;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .header-icon {
    width: 39px;
    height: 39px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    background: var(--surface-soft);
    color: var(--blue);
    font-weight: 900;
    position: relative;
  }

  .header-avatar {
    width: 39px;
    height: 39px;
    border-radius: 9px;
    object-fit: contain;
    background: transparent;
  }

  .inbox-dot {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ef3340;
    border: 2px solid #fff;
  }

  .nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 45;
    padding: 6px 9px calc(6px + env(safe-area-inset-bottom));
    background: transparent;
    pointer-events: none;
  }

  .nav-inner {
    width: 100%;
    max-width: 570px;
    height: 62px;
    margin: 0 auto;
    padding: 4px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    border: 1px solid rgba(8, 27, 45, .055);
    border-radius: 23px;
    background: rgba(255, 255, 255, .97);
    box-shadow: 0 16px 42px rgba(7, 35, 61, .14);
    backdrop-filter: blur(22px);
    pointer-events: auto;
  }

  .nav-btn {
    min-width: 0;
    height: 52px;
    padding: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    border-radius: 17px;
    background: transparent;
    color: #8492a2;
  }

  .nav-btn b {
    font-size: 19px;
    line-height: 20px;
  }

  .nav-btn span {
    font-size: 9.5px;
    font-weight: 850;
  }

  .nav-btn.active {
    background: #eaf4f9;
    color: var(--blue);
  }

  .nav-btn.add {
    background: linear-gradient(145deg, var(--blue-dark), #0b86b0);
    color: #fff;
  }

  .nav-btn.add b {
    font-size: 24px;
  }

  .page-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    margin: 5px 3px 12px;
  }

  .page-head h1,
  .page-head h2 {
    margin: 0;
    font-size: 24px;
    letter-spacing: -.04em;
  }

  .page-head p {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }

  .backbar {
    min-height: 42px;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .backbar h2 {
    margin: 0;
    font-size: 18px;
    letter-spacing: -.025em;
  }

  .back {
    height: 35px;
    padding: 0 11px;
    border-radius: 11px;
    background: #e8f2f7;
    color: var(--blue);
    font-size: 12px;
    font-weight: 900;
  }

  .card {
    overflow: hidden;
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }

  .pad {
    padding: 14px;
  }

  .quick-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 7px;
  }

  .quick-card {
    min-height: 72px;
    padding: 11px;
    border-radius: 17px;
    background: var(--surface);
    box-shadow: 0 6px 18px rgba(7, 35, 61, .055);
  }

  .quick-card strong {
    display: block;
    font-size: 15px;
    font-weight: 900;
  }

  .quick-card span {
    display: block;
    margin-top: 3px;
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 750;
  }

  .section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 17px 3px 9px;
  }

  .section-title h2 {
    margin: 0;
    font-size: 18px;
    letter-spacing: -.025em;
  }

  .field,
  textarea,
  select {
    width: 100%;
    border: 1px solid transparent;
    border-radius: 14px;
    outline: none;
    background: #f1f5f7;
    color: var(--ink);
    padding: 12px 13px;
    box-shadow: none;
  }

  textarea {
    min-height: 96px;
    resize: vertical;
  }

  .field:focus,
  textarea:focus,
  select:focus {
    background: #fff;
    border-color: rgba(7, 95, 152, .24);
  }

  .btn {
    min-height: 42px;
    padding: 10px 14px;
    border-radius: 14px;
    background: linear-gradient(145deg, var(--blue-dark), var(--blue));
    color: #fff;
    font-weight: 900;
  }

  .btn.secondary {
    background: #eaf3f8;
    color: var(--blue);
  }

  .btn.danger {
    background: #fff0f1;
    color: #b72d38;
  }

  .btn.small {
    min-height: 34px;
    padding: 8px 10px;
    border-radius: 11px;
    font-size: 12px;
  }

  .home-welcome {
    position: relative;
    overflow: hidden;
    padding: 18px;
    border-radius: 27px;
    background:
      radial-gradient(circle at 95% 5%, rgba(255,255,255,.17), transparent 28%),
      linear-gradient(145deg, #073759 0%, #075f98 64%, #0a9fbe 100%);
    color: #fff;
    box-shadow: var(--shadow-strong);
  }

  .home-welcome h1 {
    margin: 0;
    font-size: 27px;
    font-weight: 900;
    letter-spacing: -.045em;
  }

  .home-welcome p {
    margin: 6px 0 0;
    max-width: 330px;
    color: rgba(255,255,255,.76);
    font-size: 12px;
    font-weight: 750;
  }

  .home-stats {
    margin-top: 14px;
    display: flex;
    gap: 7px;
  }

  .home-stat {
    min-width: 88px;
    padding: 8px 10px;
    border-radius: 15px;
    background: rgba(255,255,255,.13);
  }

  .home-stat strong {
    display: block;
    font-size: 18px;
  }

  .home-stat span {
    color: rgba(255,255,255,.70);
    font-size: 10px;
    font-weight: 800;
  }

  .action-strip {
    margin: 10px 0 4px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .action-tile {
    min-width: 0;
    min-height: 68px;
    padding: 9px 5px;
    border-radius: 17px;
    background: #fff;
    box-shadow: 0 6px 18px rgba(7, 35, 61, .055);
    color: var(--ink);
  }

  .action-tile b {
    display: block;
    margin-bottom: 4px;
    color: var(--blue);
    font-size: 19px;
  }

  .action-tile span {
    display: block;
    font-size: 10px;
    font-weight: 850;
  }

  .filter-compact {
    margin-top: 9px;
    padding: 11px 12px;
    border-radius: 17px;
    background: #fff;
    box-shadow: 0 6px 18px rgba(7, 35, 61, .05);
  }

  .filter-compact summary {
    color: var(--blue);
    font-size: 12px;
    font-weight: 900;
  }

  .filters {
    margin-top: 9px;
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 6px;
  }

  .feed-card {
    overflow: hidden;
    border-radius: 16px;
    background: #fff;
    box-shadow: 0 7px 20px rgba(7, 35, 61, .06);
    transition: transform .08s ease;
  }

  .feed-img {
    width: 100%;
    aspect-ratio: 1 / 1.14;
    object-fit: cover;
    background: #eaf2f5;
  }

  .feed-body {
    padding: 8px;
  }

  .feed-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
    font-weight: 900;
  }

  .feed-meta {
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 700;
  }

  .feed-actions {
    margin-top: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
  }

  .mini {
    padding: 5px 7px;
    border-radius: 9px;
    background: #ebf4f8;
    color: var(--blue);
    font-size: 9.5px;
    font-weight: 900;
  }

  .gallery {
    position: relative;
    overflow: hidden;
    border-radius: 22px;
    background: #e8f1f5;
    touch-action: pan-y;
    box-shadow: var(--shadow);
  }

  .gallery-img {
    width: 100%;
    aspect-ratio: 1 / 1.02;
    object-fit: cover;
  }

  .gallery-btn {
    position: absolute;
    top: 50%;
    width: 36px;
    height: 36px;
    transform: translateY(-50%);
    border-radius: 50%;
    background: rgba(255,255,255,.88);
    color: var(--blue);
    font-size: 23px;
    font-weight: 900;
  }

  .gallery-btn.left {
    left: 9px;
  }

  .gallery-btn.right {
    right: 9px;
  }

  .gallery-dots {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 9px;
    display: flex;
    justify-content: center;
    gap: 5px;
  }

  .gallery-dot {
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: rgba(255,255,255,.55);
  }

  .gallery-dot.active {
    width: 17px;
    background: #fff;
  }

  .name-link {
    padding: 0;
    background: transparent;
    color: var(--ink);
    font-weight: 900;
  }

  .upload-slots {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
  }

  .upload-slot {
    position: relative;
    overflow: hidden;
    aspect-ratio: 1 / 1;
    display: grid;
    place-items: center;
    border-radius: 17px;
    background: #edf4f7;
    color: var(--blue);
    text-align: center;
  }

  .upload-slot img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .upload-slot .plus {
    font-size: 24px;
    font-weight: 900;
  }

  .upload-slot .slot-text {
    font-size: 10px;
    font-weight: 850;
  }

  .hidden-input {
    display: none;
  }

  .switch {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--ink);
    font-size: 12px;
    font-weight: 800;
  }

  .weather-hero {
    padding: 18px;
    border-radius: 25px;
    background:
      radial-gradient(circle at 90% 0%, rgba(255,255,255,.17), transparent 27%),
      linear-gradient(145deg, #073759, #0771aa);
    color: #fff;
    box-shadow: var(--shadow-strong);
  }

  .weather-hero h2 {
    margin: 0;
    font-size: 28px;
    letter-spacing: -.045em;
  }

  .weather-hero p {
    margin: 5px 0 0;
    color: rgba(255,255,255,.76);
    font-size: 12px;
    font-weight: 750;
  }

  .weather-search {
    margin-top: 9px;
    padding: 11px;
    border-radius: 17px;
    background: #fff;
    box-shadow: var(--shadow);
  }

  .weather-panel {
    overflow: hidden;
    border-radius: 23px;
    background: #fff;
    box-shadow: var(--shadow);
  }

  .weather-top {
    padding: 18px;
    background: linear-gradient(145deg, #073759, #0771aa);
    color: #fff;
  }

  .weather-city {
    margin: 0;
    font-size: 18px;
    font-weight: 900;
  }

  .weather-big {
    margin: 4px 0;
    font-size: 43px;
    line-height: 1;
    font-weight: 950;
    letter-spacing: -.055em;
  }

  .weather-update {
    color: rgba(255,255,255,.72);
    font-size: 11px;
    font-weight: 800;
  }

  .weather-metrics {
    padding: 10px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .weather-metric {
    padding: 10px;
    border-radius: 14px;
    background: #f1f6f8;
  }

  .weather-metric strong {
    display: block;
    font-size: 15px;
  }

  .weather-metric span {
    color: var(--muted);
    font-size: 10px;
    font-weight: 800;
  }

  .tips-grid {
    display: grid;
    gap: 6px;
  }

  .tip-card {
    padding: 10px 11px;
    border-radius: 14px;
    font-size: 11px;
    font-weight: 800;
  }

  .tip-card strong {
    display: block;
    margin-bottom: 2px;
  }

  .tip-good {
    background: #e9f7ef;
    color: #17643f;
  }

  .tip-warn {
    background: #fff4df;
    color: #8b5a0e;
  }

  .tip-bad {
    background: #ffedef;
    color: #a42f39;
  }

  .tip-info {
    background: #eaf4fb;
    color: #075f98;
  }

  .profile-top {
    padding: 5px 3px 2px;
  }

  .profile-main {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .profile-avatar {
    width: 72px;
    height: 72px;
    border-radius: 13px;
    object-fit: contain;
    background: transparent;
  }

  .profile-name {
    font-size: 23px;
    font-weight: 900;
    letter-spacing: -.04em;
  }

  .profile-level {
    margin-top: 6px;
    display: inline-flex;
    padding: 5px 8px;
    border-radius: 999px;
    background: #e8f4f9;
    color: var(--blue);
    font-size: 10px;
    font-weight: 900;
  }

  .profile-stats {
    margin-top: 13px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }

  .profile-stat {
    padding: 9px 5px;
    border-radius: 14px;
    background: #fff;
    text-align: center;
    box-shadow: 0 5px 15px rgba(7,35,61,.045);
  }

  .profile-stat strong {
    display: block;
    font-size: 15px;
  }

  .profile-stat span {
    color: var(--muted);
    font-size: 9.5px;
    font-weight: 800;
  }

  .levelbox {
    margin-top: 7px;
    padding: 10px;
    border-radius: 14px;
    background: #fff;
    box-shadow: 0 5px 15px rgba(7,35,61,.045);
  }

  .bar {
    height: 7px;
    margin-top: 7px;
    overflow: hidden;
    border-radius: 999px;
    background: #e3edf2;
  }

  .bar span {
    display: block;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--blue), var(--cyan));
  }

  .profile-section {
    margin-top: 16px;
  }

  .menu-list {
    overflow: hidden;
    border-radius: 18px;
    background: #fff;
    box-shadow: var(--shadow);
  }

  .menu-item {
    width: 100%;
    min-height: 50px;
    padding: 11px 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #fff;
    color: var(--ink);
    text-align: left;
    font-weight: 850;
    border-bottom: 1px solid rgba(8,27,45,.05);
  }

  .menu-item:last-child {
    border-bottom: 0;
  }

  .menu-item span {
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 700;
  }

  .partner-card {
    width: 100%;
    padding: 8px;
    display: grid;
    grid-template-columns: 80px 1fr;
    align-items: center;
    gap: 10px;
    border-radius: 18px;
    background: #fff;
    box-shadow: var(--shadow);
    transition: transform .08s ease;
  }

  .partner-thumb {
    width: 80px;
    height: 80px;
    border-radius: 14px;
    object-fit: cover;
    background: #eaf2f5;
  }

  .partner-plan {
    padding: 4px 7px;
    border-radius: 999px;
    background: #eaf4f9;
    color: var(--blue);
    font-size: 9.5px;
    font-weight: 900;
  }

  .heart-btn {
    margin-top: 4px;
    padding: 6px 9px;
    border-radius: 11px;
    background: #f2f5f7;
    color: #98a4b1;
    font-size: 11px;
    font-weight: 900;
  }

  .heart-btn small {
    display: inline !important;
    margin-left: 4px;
    font-size: 9.5px;
  }

  .heart-btn.liked {
    color: #e63142;
    background: #fff0f2;
    animation: heart .25s ease;

<body>
  <div id="netbar" class="netbar hide">Nu ai conexiune la internet</div>
  <div id="splash"><div class="splash-card"><img class="splash-logo" src="assets/logo-loading.webp" alt="Pescar.ro"><div class="loader-line"><span></span></div></div></div>
  <div id="root"></div>
  <div id="toast" class="toast hide"></div>
  <script>
    const REST_URL = 'https://avqkyhcdxszdwuudscym.supabase.co/rest/v1/';
    const PUBLIC_KEY = 'sb_publishable_WNnq6AxfgXRbxWY8zsOw-A_iNULRo7M';
    const SUPABASE_URL = REST_URL.replace('/rest/v1/', '');
    const VERSION = '1.4.0';
    const LEVELS = [
      [0,'Începător'],[500,'Ucenic Pescar'],[1500,'Pescar'],[3500,'Pescar Priceput'],[7000,'Pescar Avansat'],[12000,'Pescar Experimentat'],[20000,'Expert'],[32000,'Maestru Pescar'],[50000,'Veteran'],[80000,'Legendă Pescar.ro']
    ];
    const $ = (id)=>document.getElementById(id);
    const state = { token: localStorage.getItem('pescar_token') || '', user:null, stats:{members:0,active:0}, unread:0, page:'home', previous:'home', authMode:'login', feed:[], myCatches:[], records:[], partners:[], inbox:[], leaderboard:[], blocked:[], xp:[], deferredInstall:null, filterLoc:'', filterSpec:'', lastWeather: JSON.parse(localStorage.getItem('pescar_last_weather') || 'null') };

    function esc(v){return String(v ?? '').replace(/[&<>'"]/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[s]));}
    function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
    function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hide');setTimeout(()=>t.classList.add('hide'),3300);}
    function fmtDate(d){if(!d)return '—';return new Date(d).toLocaleDateString('ro-RO',{day:'2-digit',month:'short',year:'numeric'});}
    function fmtDateTime(d){if(!d)return '—';return new Date(d).toLocaleString('ro-RO',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}
    function levelInfo(xp){let idx=0;for(let i=0;i<LEVELS.length;i++){if(xp>=LEVELS[i][0]) idx=i;}const cur=LEVELS[idx], next=LEVELS[Math.min(idx+1,LEVELS.length-1)];const inLevel=xp-cur[0], need=Math.max(1,next[0]-cur[0]);return {level:idx+1,title:cur[1],nextTitle:next[1],cur:cur[0],next:next[0],pct:idx===LEVELS.length-1?100:Math.min(100,Math.round(inLevel/need*100)),left:Math.max(0,next[0]-xp)};}
    function avatar(u){return esc(u?.avatar_url || 'assets/icon-192.png');}
    function firstImage(item){return Array.isArray(item.images)&&item.images[0]?item.images[0]:'assets/icon-512.png';}
    function headers(json=true){const h={apikey:PUBLIC_KEY, Authorization:'Bearer '+PUBLIC_KEY}; if(json) h['Content-Type']='application/json'; return h;}
    async function rpc(fn,args={}){try{const res=await fetch(REST_URL+'rpc/'+fn,{method:'POST',headers:headers(true),body:JSON.stringify(args)});const data=await res.json().catch(()=>({ok:false,error:'Răspuns invalid.'}));if(!res.ok) throw new Error(data.message || data.error || 'Verifică conexiunea la internet!');return data;}catch(e){console.error(fn,e);if(String(e.message||'').toLowerCase().includes('failed'))throw new Error('Verifică conexiunea la internet!');throw e;}}
    async function requireOk(fn,args={}){const data=await rpc(fn,args); if(!data.ok) throw new Error(data.error||'Operațiunea a eșuat.'); return data;}

    function appShell(content, active='home') {
      return `<div class="app">
        <header class="topbar">
          <div class="topbar-inner">
            <button class="brand" onclick="App.go('home')" aria-label="Acasă">
              <img class="brand-logo" src="assets/logo-header.webp" alt="Pescar.ro">
            </button>
            <div class="header-actions">
              <button class="header-icon" onclick="App.openInbox()" aria-label="Inbox">
                ✉
                ${state.unread ? '<span class="inbox-dot"></span>' : ''}
              </button>
              <button class="header-icon" onclick="App.go('profile')" aria-label="Profil">
                <img class="header-avatar" src="${avatar(state.user)}" alt="Profil">
              </button>
            </div>
          </div>
        </header>

        <main class="screen">${content}</main>

        <nav class="nav">
          <div class="nav-inner">
            ${navBtn('home', '⌂', 'Acasă', active)}
            ${navBtn('catches', '◉', 'Capturi', active)}
            ${navBtn('add', '+', 'Adaugă', active, true)}
            ${navBtn('weather', '☁', 'Vreme', active)}
            ${navBtn('profile', '●', 'Profil', active)}
          </div>
        </nav>
      </div>
      ${installBanner()}`;
    }

    function navBtn(page,icon,label,active,add=false){return `<button class="nav-btn ${active===page?'active':''} ${add?'add':''}" onclick="App.go('${page}')"><b>${icon}</b><span>${label}</span></button>`;}
    function backHeader(title) {
      return `<div class="backbar">
        <button class="back" onclick="App.back()">‹ Înapoi</button>
        <h2>${esc(title)}</h2>
      </div>`;
    }
    function installBanner(){return state.deferredInstall?`<div class="install"><strong>Instalează Pescar.ro</strong><p>Adaugă aplicația pe ecranul principal ca PWA.</p><div class="row"><button class="btn small" onclick="App.install()">Instalează</button><button class="btn secondary small" onclick="App.dismissInstall()">Mai târziu</button></div></div>`:'';}
    function loadingShell(active='home',text='Se încarcă...'){$('root').innerHTML=appShell(`<div class="loading-card">${esc(text)}</div>`,active);}
    function runSoon(fn){setTimeout(fn,0);}

    
    let silentRefreshTimer = null;
    let silentRefreshBusy = false;

    function sameJson(a, b) {
      try {
        return JSON.stringify(a) === JSON.stringify(b);
      } catch {
        return false;
      }
    }

    function syncUnreadDot() {
      const inboxButtons = document.querySelectorAll('.header-icon');
      if (!inboxButtons.length) return;

      const inboxButton = inboxButtons[0];
      let dot = inboxButton.querySelector('.inbox-dot');

      if (state.unread > 0 && !dot) {
        dot = document.createElement('span');
        dot.className = 'inbox-dot';
        inboxButton.appendChild(dot);
      }

      if (state.unread <= 0 && dot) {
        dot.remove();
      }
    }

    async function silentRefresh() {
      if (!state.token || !navigator.onLine || silentRefreshBusy) return;

      silentRefreshBusy = true;

      try {
        const tasks = [
          requireOk('api_me', {
            p_token: state.token
          }).catch(() => null),

          requireOk('api_get_feed', {
            p_token: state.token,
            p_location_filter: state.filterLoc || '',
            p_species_filter: state.filterSpec || '',
            p_limit: 30,
            p_offset: 0
          }).catch(() => null),

          requireOk('api_get_partners', {
            p_token: state.token
          }).catch(() => null),

          requireOk('api_get_inbox', {
            p_token: state.token
          }).catch(() => null)
        ];

        const [me, feed, partners, inbox] = await Promise.all(tasks);

        if (me) {
          const currentUser = state.user;
          hydrateMe(me);
          if (currentUser && state.page !== 'profile') {
            state.user = {
              ...currentUser,
              ...state.user
            };
          }
        }

        if (feed?.items && !sameJson(feed.items, state.feed)) {
          state.feed = feed.items;
          patchHomeFeed();
        }

        if (partners?.items && !sameJson(partners.items, state.partners)) {
          state.partners = partners.items;
        }

        if (inbox?.items) {
          state.inbox = inbox.items;
          state.unread = inbox.items.filter(item => !item.read_at).length;
          syncUnreadDot();
        }

        state.lastSilentRefresh = Date.now();
      } finally {
        silentRefreshBusy = false;
      }
    }

    function startSilentRefresh() {
      if (silentRefreshTimer) {
        clearInterval(silentRefreshTimer);
      }

      silentRefreshTimer = setInterval(() => {
        silentRefresh();
      }, 15000);

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          silentRefresh();
        }
      });

      window.addEventListener('focus', () => {
        silentRefresh();
      });
    }

    async function init(){
      if('serviceWorker' in navigator){
        try{
          const hadController=!!navigator.serviceWorker.controller;
          const reg=await navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'});
          reg.update().catch(()=>{});
          // Verifica periodic daca service-worker.js s-a schimbat, fara cache-ul HTTP al browserului.
          setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
}catch(e){}
      }
      document.addEventListener('touchstart',()=>{}, {passive:true});
      window.addEventListener('online',()=>$('netbar').classList.add('hide'));
      window.addEventListener('offline',()=>$('netbar').classList.remove('hide'));
      if(!navigator.onLine) $('netbar').classList.remove('hide');
      window.addEventListener('beforeinstallprompt',e=>{e.preventDefault(); state.deferredInstall=e; render();});
      if(state.token){
        try{
          const me = await requireOk('api_me', {
            p_token: state.token
          });

          hydrateMe(me);
          state.page = 'home';
          renderHome();
          refreshHomeSilently();
        }catch(e){
          localStorage.removeItem('pescar_token');
          state.token = '';
          renderAuth();
        }
      }else{
        renderAuth();
      }

      startSilentRefresh();
      silentRefresh();

      $('splash').style.opacity = '0';
      setTimeout(() => $('splash')?.remove(), 160);
    }
    function hydrateMe(me){state.user=me.user;state.unread=me.unread||0;state.stats=me.stats||{members:0,active:0};}

    function renderAuth(){
      $('root').innerHTML = `<div class="center"><div class="auth-card">
        <img class="auth-logo" src="assets/logo-loading.webp" alt="Pescar.ro">
        <div class="seg"><button class="${state.authMode==='login'?'active':''}" onclick="App.setAuth('login')">Conectare</button><button class="${state.authMode==='register'?'active':''}" onclick="App.setAuth('register')">Înregistrare</button></div>
        ${state.authMode==='login'?loginForm():registerForm()}
        <p class="muted" style="font-size:12px;text-align:center;margin:14px 0 0">Fără confirmare prin email. Emailul și PIN-ul nu pot fi schimbate.</p>
      </div></div>`;
    }
    function loginForm(){return `<div class="form-grid"><input id="loginEmail" class="field" type="email" placeholder="Email"><input id="loginPin" class="field pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" placeholder="••••" oninput="App.pinClamp(this)"><button class="btn" onclick="App.login()">Intră în aplicație</button></div>`;}
    function registerForm(){return `<div class="form-grid"><input id="regEmail" class="field" type="email" placeholder="Email"><input id="regName" class="field" placeholder="Nume afișat"><div class="card pad" style="box-shadow:none;background:#f7fbff"><strong>Alege locația</strong><p class="muted" style="margin:5px 0 10px">Caută localitatea și selecteaz-o din listă.</p><input id="regLocationSearch" class="field" placeholder="Caută localitatea, ex. Brașov"><input id="regLocation" type="hidden"><button class="btn secondary small" onclick="App.searchRegisterLocation()" type="button">Caută locația</button><div id="regLocationResults" class="stack" style="margin-top:10px"></div></div><input id="regPin" class="field pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" placeholder="••••" oninput="App.pinClamp(this)"><button class="btn" onclick="App.register()">Creează cont</button></div>`;}

    
    function pinClamp(el){el.value=el.value.replace(/\D/g,'').slice(0,4);}
    async function searchRegisterLocation(){const q=$('regLocationSearch').value.trim();if(!q)return toast('Scrie localitatea.');$('regLocationResults').innerHTML='<div class="muted">Caut...</div>';try{const g=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=ro&format=json`,{cache:'no-store'}).then(r=>r.json());const items=g.results||[];if(!items.length){$('regLocationResults').innerHTML='<div class="muted">Nu am găsit localitatea.</div>';return;}$('regLocationResults').innerHTML=items.map(x=>{const label=[x.name,x.admin1,x.country_code].filter(Boolean).join(', ');return `<button class="menu-item" type="button" onclick="App.selectRegisterLocation('${esc(label)}')">${esc(label)}<span>selectează</span></button>`}).join('');}catch(e){$('regLocationResults').innerHTML='<div class="muted">Verifică conexiunea la internet!</div>';}}
    function selectRegisterLocation(label){$('regLocation').value=label;$('regLocationSearch').value=label;$('regLocationResults').innerHTML='<div class="status activ">Locație selectată</div>';}

    async function login() {
      try {
        const data = await requireOk('api_login', {
          p_email: $('loginEmail').value,
          p_pin: $('loginPin').value
        });

        state.token = data.token;
        localStorage.setItem('pescar_token', data.token);
        hydrateMe(data);

        state.page = 'home';
        renderHome();
        refreshHomeSilently();
        silentRefresh();

        toast('Bine ai venit!');
      } catch (error) {
        toast(error.message);
      }
    }

    async function register() {
      try {
        const pin = $('regPin').value;
        pinClamp($('regPin'));

        if (!/^\d{4}$/.test(pin)) {
          toast('PIN-ul trebuie să aibă exact 4 cifre.');
          return;
        }

        const location = $('regLocation').value;

        if (!location) {
          toast('Caută și selectează locația.');
          return;
        }

        const data = await requireOk('api_register', {
          p_email: $('regEmail').value,
          p_name: $('regName').value,
          p_pin: pin,
          p_location: location
        });

        state.token = data.token;
        localStorage.setItem('pescar_token', data.token);
        hydrateMe(data);

        state.page = 'home';
        renderHome();
        refreshHomeSilently();
        silentRefresh();

        toast('Cont creat cu succes.');
      } catch (error) {
        toast(error.message);
      }
    }

    function setAuth(m){state.authMode=m;renderAuth();}

    async function refreshMe(){const me=await requireOk('api_me',{p_token:state.token});hydrateMe(me);}
    async function go(page) {
      state.previous = state.page;
      state.page = page;

      try {
        if (page === 'add') {
          renderAdd();
          return;
        }

        if (page === 'weather') {
          renderWeather();
          return;
        }

        if (page === 'home') {
          renderHome();
          refreshHomeSilently();
          return;
        }

        if (page === 'catches') {
          renderMyCatchesInstant();
          refreshMyCatchesSilently();
          return;
        }

        if (page === 'profile') {
          renderProfileLocal();
          refreshProfileView();
          return;
        }

        if (page === 'partners') {
          openPartners();
          return;
        }

        if (page === 'guide') {
          openGuide();
          return;
        }
      } catch (error) {
        toast(error.message);
      }
    }

    function back() {
      const target = state.previous || 'home';

      if (target === 'partners') {
        openPartners();
        return;
      }

      if (target === 'guide') {
        openGuide();
        return;
      }

      if (target === 'partner') {
        openPartners();
        return;
      }

      go(target);
    }

    async function refreshHomeSilently() {
      if (!state.token || !navigator.onLine) return;

      try {
        const data = await requireOk('api_get_feed', {
          p_token: state.token,
          p_location_filter: state.filterLoc || '',
          p_species_filter: state.filterSpec || '',
          p_limit: 30,
          p_offset: 0
        });

        state.feed = data.items || [];
        patchHomeFeed();
      } catch {}
    }

    function renderMyCatchesInstant() {
      if (state.myCatches?.length || state.records?.length) {
        renderMyCatches();
        return;
      }

      $('root').innerHTML = appShell(`
        <div class="page-head">
          <div>
            <h1>Capturile mele</h1>
            <p>Capturile tale se actualizează în fundal.</p>
          </div>
        </div>
        <div class="loading-card">Se sincronizează...</div>
      `, 'catches');
    }

    async function refreshMyCatchesSilently() {
      try {
        const [mine, records] = await Promise.all([
          requireOk('api_get_my_catches', {
            p_token: state.token
          }),
          requireOk('api_get_records', {
            p_token: state.token
          })
        ]);

        state.myCatches = mine.items || [];
        state.records = records.items || [];

        if (state.page === 'catches') {
          renderMyCatches();
        }
      } catch {
        if (!state.myCatches?.length && state.page === 'catches') {
          $('root').innerHTML = appShell(`
            ${backHeader('Capturile mele')}
            <div class="empty">Verifică conexiunea la internet!</div>
          `, 'catches');
        }
      }
    }

    function partnerPhotoLimit(plan){return plan==='premium'?10:plan==='plus'?6:3;}
    
    async function loadHome(reload=false) {
      const location = $('fLoc')?.value ?? state.filterLoc ?? '';
      const species = $('fSpec')?.value ?? state.filterSpec ?? '';

      state.filterLoc = location;
      state.filterSpec = species;

      if (state.page === 'home') {
        renderHome();
      }

      try {
        const data = await requireOk('api_get_feed', {
          p_token: state.token,
          p_location_filter: location,
          p_species_filter: species,
          p_limit: 30,
          p_offset: 0
        });

        state.feed = data.items || [];
        patchHomeFeed();
      } catch (error) {
        toast(error.message);
      }
    }

    function resetFilters(){state.filterLoc='';state.filterSpec='';loadHome();}
    function patchHomeFeed() {
      const host = $('homeFeed');

      if (!host || state.page !== 'home') {
        return;
      }

      const hasFilters = Boolean(state.filterLoc || state.filterSpec);

      host.innerHTML = state.feed.length
        ? `<div class="grid2">${state.feed.map(captureCard).join('')}</div>`
        : `<div class="empty">${
            hasFilters
              ? 'Nu există capturi pentru filtrele alese.'
              : 'Nu există capturi încă.'
          }</div>`;
    }

    function renderCatchDetail(c){c=normalizeCatch(c);state.detailCatch=c;state.detailImages=Array.isArray(c.images)&&c.images.length?c.images:[firstImage(c)];state.detailIndex=0;const imgs=state.detailImages;const isOwner=ownsCatch(c);const isAdmin=state.user?.role==='admin';const authorName=esc(c.author?.name||'Pescar');const gallery=`<div class="gallery" id="galleryBox" ontouchstart="App.galleryTouchStart(event)" ontouchend="App.galleryTouchEnd(event)"><img id="galleryImg" class="gallery-img" src="${esc(imgs[0])}" alt="Captură">${imgs.length>1?`<button class="gallery-btn left" onclick="App.galleryPrev()">‹</button><button class="gallery-btn right" onclick="App.galleryNext()">›</button><div class="gallery-dots" id="galleryDots">${imgs.map((_,i)=>`<span class="gallery-dot ${i===0?'active':''}"></span>`).join('')}</div>`:''}</div>`;const actions=isOwner?`<button class="btn secondary small" onclick="App.shareCatch('${c.id}')">Distribuie</button><button class="btn secondary small" onclick="App.openEditCatch('${c.id}')">Editează</button><button class="btn danger small" onclick="App.deleteCatch('${c.id}')">Șterge</button>`:`<button class="btn secondary small" onclick="App.shareCatch('${c.id}')">Distribuie</button><button class="btn secondary small" onclick="App.report('catch','${c.id}')">Raportează</button>${isAdmin?`<button class="btn danger small" onclick="App.adminDeleteCatch('${c.id}')">Șterge postarea</button>`:''}`;$('root').innerHTML=appShell(`${backHeader('Detalii captură')}<div class="stack">${gallery}<div class="card pad"><h2 style="margin:0;font-weight:900;text-shadow:none">${esc(c.species||'Specie necompletată')}</h2><p class="muted">Prins de <button class="name-link" onclick="App.openProfile('${c.author.id}')">${authorName}</button> · ${fmtDate(c.created_at)}</p><div class="quick-grid"><div class="quick-card"><strong>${esc(c.weight_kg?c.weight_kg+' kg':'—')}</strong><span>Greutate</span></div><div class="quick-card"><strong>${esc(c.length_cm?c.length_cm+' cm':'—')}</strong><span>Lungime</span></div><div class="quick-card"><strong>${esc(c.location||'—')}</strong><span>Locație</span></div><div class="quick-card"><strong>${c.catch_release?'Da':'Nu'}</strong><span>Catch & Release</span></div></div><p>${esc(c.description||'Fără descriere.')}</p><div class="row">${actions}</div></div></div>`,'home');}
    function updateGallery(){const img=$('galleryImg'),dots=$('galleryDots');if(!img||!state.detailImages?.length)return;img.src=state.detailImages[state.detailIndex];if(dots)dots.innerHTML=state.detailImages.map((_,i)=>`<span class="gallery-dot ${i===state.detailIndex?'active':''}"></span>`).join('');}

    function captureSlotPreview(slot){const input=$('capImage'+slot),wrap=$('slotWrap'+slot);if(!input||!wrap)return;const file=input.files?.[0];wrap.classList.remove('filled');wrap.querySelectorAll('img').forEach(n=>n.remove());if(!file)return;const img=document.createElement('img');img.src=URL.createObjectURL(file);wrap.prepend(img);wrap.classList.add('filled');}
    function getCaptureFiles(){return [1,2,3].map(i=>$('capImage'+i)?.files?.[0]).filter(Boolean).slice(0,3);}
    async function submitCatch(){try{const files=getCaptureFiles();const urls=[];for(const f of files){urls.push(await imageFileToDataUrl(f,980,.70,false));}await requireOk('api_create_catch',{p_token:state.token,p_species:$('capSpecies').value,p_weight_kg:num($('capWeight').value),p_length_cm:num($('capLength').value),p_location:$('capLocation').value,p_description:$('capDesc').value,p_catch_release:$('capCR').checked,p_images:urls});toast('Captura a fost publicată.');go('catches');}catch(e){toast('Eroare captură: '+e.message);}}

    function renderWeather() {
      const saved = (state.user?.location || '').trim();
      const fallback = saved && !/^rom[aâ]nia$/i.test(saved) ? saved : '';
      const last = state.lastWeather;
      const value = last?.city || fallback || '';

      const content = `
        <section class="weather-hero">
          <h2>Vreme</h2>
          <p>Alege localitatea sau folosește GPS-ul.</p>
        </section>

        <div class="weather-search">

              <button class="btn secondary" onclick="App.useMyWeatherLocation()">
                Folosește GPS
              </button>
            </div>
          </div>
        </div>

        <div id="weatherResult" style="margin-top:9px"></div>

      $('root').innerHTML = appShell(content, 'weather');

      if (last?.lat && last?.lon) {

    async function reverseWeatherLabel(lat,lon){try{const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ro`,{cache:'no-store'}).then(x=>x.json());return [r.city||r.locality||r.principalSubdivision,r.principalSubdivision,r.countryName].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(', ') || `Lat ${lat.toFixed(3)}, Lon ${lon.toFixed(3)}`;}catch(e){return `Lat ${lat.toFixed(3)}, Lon ${lon.toFixed(3)}`;}}
    async function useMyWeatherLocation(){if(!navigator.geolocation)return toast('Browserul nu permite GPS.');$('weatherResult').innerHTML='<div class="card pad">Caut poziția prin GPS...</div>';navigator.geolocation.getCurrentPosition(async pos=>{const lat=pos.coords.latitude,lon=pos.coords.longitude;const label=await reverseWeatherLabel(lat,lon);App.loadWeatherByCoords(lat,lon,label,true);},err=>{$('weatherResult').innerHTML='<div class="card pad">Verifică permisiunea pentru GPS sau caută localitatea manual.</div>';},{enableHighAccuracy:false,timeout:9000,maximumAge:600000});}
    async function loadWeather(prefill='',save=true){const city=(typeof prefill==='string'&&prefill?prefill:$('weatherCity').value).trim();if($('weatherCity') && city) $('weatherCity').value=city;if(!city)return toast('Scrie localitatea.');$('weatherResult').innerHTML='<div class="card pad">Se actualizează vremea...</div>';try{const g=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=ro&format=json`,{cache:'no-store'}).then(r=>r.json());if(!g.results?.length)throw new Error('Localitate negăsită. Scrie orașul/satul mai exact.');const p=g.results[0];const label=[p.name,p.admin1,p.country_code].filter(Boolean).join(', ');return App.loadWeatherByCoords(p.latitude,p.longitude,label,save,city);}catch(e){$('weatherResult').innerHTML=`<div class="card pad">${esc(e.message)}</div>`;}}
    async function loadWeatherByCoords(lat,lon,label='Vremea ta',save=true,city=''){try{const w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,pressure_msl&daily=sunrise,sunset&timezone=auto`,{cache:'no-store'}).then(r=>r.json());const c=w.current;if(!c)throw new Error('Nu am putut actualiza vremea.');if(save){state.lastWeather={lat,lon,label,city:city||label};localStorage.setItem('pescar_last_weather',JSON.stringify(state.lastWeather));}const tips=weatherTips(c);$('weatherResult').innerHTML=`<div class="weather-panel"><div class="weather-top"><p class="weather-city">${esc(label)}</p><div class="weather-big">${c.temperature_2m}°C</div><div class="weather-update">Vânt ${c.wind_speed_10m} km/h · Umiditate ${c.relative_humidity_2m}%</div></div><div class="weather-metrics"><div class="weather-metric"><strong>${c.wind_speed_10m} km/h</strong><span>Vânt</span></div><div class="weather-metric"><strong>${c.pressure_msl} hPa</strong><span>Presiune</span></div><div class="weather-metric"><strong>${c.relative_humidity_2m}%</strong><span>Umiditate</span></div><div class="weather-metric"><strong>${c.precipitation} mm</strong><span>Ploaie</span></div></div><div class="pad"><p class="muted">Răsărit: ${new Date(w.daily.sunrise[0]).toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'})} · Apus: ${new Date(w.daily.sunset[0]).toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'})}</p><h2 style="margin:12px 0 4px">Sfaturi</h2><div class="tips-grid">${tips.map(t=>`<div class="tip-card tip-${t.type}"><strong>${t.title}</strong>${t.text}</div>`).join('')}</div></div></div>`;}catch(e){$('weatherResult').innerHTML=`<div class="card pad">${esc(e.message)}</div>`;}}
    function weatherTips(c){const tips=[];if(c.wind_speed_10m>28)tips.push({type:'bad',title:'Vânt puternic',text:'Alege zone adăpostite, mal cu copaci sau golfuri. Evită lansările lungi.'});else if(c.wind_speed_10m>14)tips.push({type:'warn',title:'Vânt moderat',text:'Ține lanseta mai jos și folosește plumbi/năluci puțin mai stabile.'});else tips.push({type:'good',title:'Vânt bun',text:'Condiții bune pentru prezentări fine și control mai bun al monturii.'});if(c.pressure_msl<1008)tips.push({type:'good',title:'Presiune joasă',text:'Peștii pot deveni mai activi înainte de schimbarea vremii.'});else if(c.pressure_msl>1022)tips.push({type:'warn',title:'Presiune ridicată',text:'Încearcă prezentări lente, momeli mici și zone mai adânci.'});else tips.push({type:'info',title:'Presiune stabilă',text:'Caută structuri, praguri și zone cu hrană naturală.'});if(c.temperature_2m>28)tips.push({type:'bad',title:'Căldură mare',text:'Cele mai bune șanse sunt dimineața devreme sau seara.'});else if(c.temperature_2m<8)tips.push({type:'warn',title:'Rece',text:'Folosește momeală puțină și mișcări lente.'});else tips.push({type:'good',title:'Temperatură ok',text:'Poți încerca atât maluri, cât și zone cu adâncime medie.'});if(c.precipitation>0)tips.push({type:'info',title:'Ploaie',text:'Ploaia ușoară poate ajuta. La furtună sau fulgere, oprește partida.'});return tips;}
    function weatherAdvice(c){let a=[];if(c.wind_speed_10m>24)a.push('Vântul este mai puternic. Caută zone adăpostite și evită lansările lungi.');else a.push('Vântul este acceptabil pentru o partidă normală.');if(c.pressure_msl<1008)a.push('Presiunea este mai joasă, peștii pot fi mai activi, dar vremea se poate schimba.');if(c.temperature_2m>28)a.push('Pe căldură mare încearcă dimineața devreme sau seara.');if(c.precipitation>0)a.push('Ploaia ușoară poate fi bună, dar verifică siguranța zonei.');return a.join(' ');}

    function renderProfileLocal() {

    async function refreshProfileView(){try{await refreshMe();if(state.page==='profile')renderProfileLocal();}catch(e){}}
    async function renderProfile(){renderProfileLocal();refreshProfileView();}
    function openEditProfile(){state.previous='profile';$('root').innerHTML=appShell(`${backHeader('Editează profilul')}<div class="card pad"><div class="form-grid"><label class="avatar-picker">Adaugă poză de profil<input id="avatarFile" type="file" accept="image/*"><span>Alege o imagine din telefon</span></label><input id="editName" class="field" value="${esc(state.user.name)}" placeholder="Nume afișat"><p class="muted" style="margin:0 4px">Numele afișat se poate schimba o singură dată la 15 zile.</p><p class="muted" style="margin:0 4px">Emailul și PIN-ul rămân aceleași.</p><button class="btn" onclick="App.saveProfile()">Salvează profilul</button></div></div>`,'profile');}
    async function saveProfile(){try{let avatarUrl=null;const file=$('avatarFile').files[0];if(file){avatarUrl=await imageFileToDataUrl(file,512,.82,false);}const d=await requireOk('api_update_profile',{p_token:state.token,p_name:$('editName').value,p_location:state.user.location,p_avatar_url:avatarUrl});state.user=d.user;toast('Profil salvat.');renderProfile();}catch(e){toast(e.message);}}

    function openChangeLocation(){state.previous='profile';$('root').innerHTML=appShell(`${backHeader('Schimbă locația')}<div class="card pad"><div class="form-grid"><p class="muted" style="margin-top:0">Caută localitatea nouă și selecteaz-o din listă.</p><input id="changeLocationSearch" class="field" placeholder="Caută localitatea, ex. Brașov"><button class="btn secondary" onclick="App.searchChangeLocation()">Caută locația</button><div id="changeLocationResults" class="stack"></div></div></div>`,'profile');}
    async function searchChangeLocation(){const q=$('changeLocationSearch').value.trim();if(!q)return toast('Scrie localitatea.');$('changeLocationResults').innerHTML='<div class="muted">Caut...</div>';try{const g=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=ro&format=json`,{cache:'no-store'}).then(r=>r.json());const items=g.results||[];if(!items.length){$('changeLocationResults').innerHTML='<div class="muted">Nu am găsit localitatea.</div>';return;}$('changeLocationResults').innerHTML=items.map(x=>{const label=[x.name,x.admin1,x.country_code].filter(Boolean).join(', ');return `<button class="menu-item" onclick="App.saveLocation('${esc(label)}')">${esc(label)}<span>setează</span></button>`}).join('');}catch(e){$('changeLocationResults').innerHTML='<div class="muted">Verifică conexiunea la internet!</div>';}}
    async function saveLocation(label){try{const d=await requireOk('api_update_profile',{p_token:state.token,p_name:state.user.name,p_location:label,p_avatar_url:null});state.user=d.user;toast('Locație actualizată.');renderProfile();}catch(e){toast(e.message);}}
    async function openProfile(id){try{const d=await requireOk('api_get_public_profile',{p_token:state.token,p_user_id:id});state.previous=state.page;const p=d.profile;const cards=(d.catches||[]).map(c=>`<article class="feed-card" onclick="App.openCatch('${c.id}')"><img class="feed-img" src="${esc(firstImage(c))}"><div class="feed-body"><div class="feed-title">${esc(c.species||'Specie necompletată')}</div><div class="feed-meta">${fmtDate(c.created_at)}</div></div></article>`).join('');$('root').innerHTML=appShell(`${backHeader('Profil pescar')}<div class="profile-head"><div class="profile-main"><img class="profile-avatar" src="${avatar(p)}"><div><div class="profile-name">${esc(p.name)}</div><div class="muted">${esc(p.location||'România')}</div><div class="status">${p.catches_count||0} capturi · ${p.species_count||0} specii</div></div></div><div class="row" style="margin-top:14px"><button class="btn secondary small" onclick="App.report('profile','${p.id}')">Raportează</button><button class="btn danger small" onclick="App.blockUser('${p.id}')">Blochează</button></div></div><div class="section-title"><h2>Capturi publice</h2></div>${cards?`<div class="grid2">${cards}</div>`:'<div class="empty card">Nu are capturi publice.</div>'}`,'home');}catch(e){toast(e.message);}}
    async function blockUser(id){if(!confirm('Blochezi acest utilizator?'))return;try{await requireOk('api_block_user',{p_token:state.token,p_blocked_id:id});toast('Utilizator blocat.');loadHome();}catch(e){toast(e.message);}}

        ${state.inbox?.length
          ? `<div class="stack">
              ${state.inbox.map(message => `
                <div class="card pad">
                  <div class="row" style="justify-content:space-between">
                    <strong>${esc(message.title)}</strong>
                    <span class="muted" style="font-size:10px">
                      ${fmtDateTime(message.created_at)}

            </div>`

    async function openInbox() {
      state.previous = state.page;

      if (state.inbox?.length) {
        renderInbox();
      } else {
        $('root').innerHTML = appShell(`
          ${backHeader('Inbox')}
          <div class="loading-card">Se sincronizează...</div>
        `, 'profile');
      }

      try {
        const data = await requireOk('api_get_inbox', {
          p_token: state.token
        });

        state.inbox = data.items || [];
        state.unread = 0;

        if (state.page === 'inbox') {
          renderInbox();
        }

        syncUnreadDot();

        requireOk('api_mark_inbox_read', {
          p_token: state.token,
          p_message_id: null
        }).catch(() => {});
      } catch (error) {
        if (!state.inbox?.length) {
          toast(error.message);
        }
      }
    }

    const GUIDE_ARTICLES=[
      {title:'Început rapid',desc:'Pașii de bază pentru prima partidă.',body:`<div class="article"><h3>Ce faci înainte să pleci</h3><ul><li>Alege o apă ușor accesibilă și verifică regulile locale înainte de partidă.</li><li>Ia echipament simplu: lansetă, mulinetă, fir, cârlige, plumbi, minciog, extractor și o găleată pentru nadă.</li><li>Pregătește momeli de bază: porumb, viermi, râme, pelete sau nadă simplă.</li></ul><h3>La apă</h3><p>Începe cu o zonă liniștită, caută praguri, vegetație, umbre, curent mai domol sau zone unde vezi activitate la suprafață. Nu arunca multă nadă din prima; testează și ajustează.</p></div>`},
      {title:'Momeli și nade',desc:'Ce folosești, când și de ce.',body:`<div class="article"><h3>Momeli naturale</h3><p>Viermii și râmele sunt potrivite pentru caras, plătică, babușcă, biban și multe specii pașnice. Porumbul și peletele merg bine la crap, caras mare și amur.</p><h3>Nadă simplă</h3><ul><li>Adaugă apa treptat, nu dintr-o dată.</li><li>Lasă nada să tragă apa 10 minute, apoi sfărâmă bulgării.</li><li>Pe apă rece folosește nadă puțină și fină; pe apă caldă poți crește cantitatea.</li></ul></div>`},
      {title:'Monturi de bază',desc:'Feeder, plută, crap și răpitor.',body:`<div class="article"><h3>Feeder</h3><p>Folosește coșuleț, forfac de 30-70 cm și cârlig potrivit momelii. Este o montură bună pentru plătică, caras, crap și babușcă.</p><h3>Plută</h3><p>Potrivită pentru ape liniștite și pești aproape de mal. Reglează adâncimea până găsești nivelul la care trage peștele.</p><h3>Răpitor</h3><p>La știucă, șalău și biban folosește năluci adaptate adâncimii: jiguri, voblere, rotative sau oscilante.</p></div>`},
      {title:'Noduri esențiale',desc:'Noduri ușor de învățat.',body:`<div class="article"><h3>Palomar</h3><p>Foarte bun pentru cârlige, agrafe și vârtejuri. Umezește nodul înainte să îl strângi.</p><h3>Clinch îmbunătățit</h3><p>Simplu și util pentru fire mono/fluorocarbon. Fă 5-7 spire, trece capătul prin buclă și strânge uniform.</p><h3>Nod pentru înaintaș</h3><p>Folosește-l când legi două fire diferite. Testează nodul înainte de lansare.</p></div>`},
      {title:'Specii de pești',desc:'Crap, caras, somn, știucă, șalău și altele.',body:`<div class="article"><h3>Crap</h3><p>Caută zone cu praguri, stuf, scoici, mâl tare sau platouri. Momeli: porumb, boilies, pelete, râme mari. Merge bine dimineața și seara.</p><h3>Caras</h3><p>Stă des lângă vegetație și zone cu nămol. Momeli: viermi, râme, porumb mic, pâine. Nădire fină și constantă.</p><h3>Plătică, babușcă, roșioară</h3><p>Pești de banc. Folosește cârlige mici, nadă fină și viermi sau râme subțiri.</p><h3>Somn</h3><p>Caută gropi, maluri surpate și zone adânci. Momeli: râme mari, pește sau alte momeli permise local.</p><h3>Știucă</h3><p>Preferă vegetația, golfurile și zonele de pândă. Năluci: linguri, voblere, spinnerbait, jerkbait. Folosește strună.</p><h3>Șalău</h3><p>Stă pe substrat tare, praguri și zone cu peștișor. Jiguri și voblere conduse lent.</p><h3>Biban, clean, mreană, scobar, avat, păstrăv</h3><p>Bibanul răspunde la năluci mici; cleanul la insecte, pâine și voblere mici; mreana și scobarul stau pe curent; avatului îi plac nălucile rapide; păstrăvul cere prezentări fine și apă oxigenată.</p></div>`},
      {title:'Citirea apei și vremii',desc:'Unde cauți peștele.',body:`<div class="article"><h3>Semne utile</h3><ul><li>Pragurile și schimbările de adâncime țin pește.</li><li>Vegetația oferă hrană și adăpost.</li><li>Vântul moderat poate împinge hrana spre malul bătut de val.</li><li>Presiunea schimbătoare poate activa peștii, dar furtuna este periculoasă.</li></ul></div>`},
      {title:'Echipament',desc:'Ce merită cumpărat la început.',body:`<div class="article"><h3>Set simplu</h3><p>O lansetă universală, o mulinetă potrivită, fir corect, cârlige de mărimi diferite, plumbi, plute, vârtejuri, minciog și saltea de primire.</p><h3>Întreținere</h3><p>Clătește echipamentul după noroi/praf, verifică firul și nodurile, usucă minciogul și nu depozita nada udă lângă echipament.</p></div>`},
      {title:'Catch & Release',desc:'Cum eliberezi peștele corect.',body:`<div class="article"><ul><li>Pregătește minciogul înainte de drill.</li><li>Umezește mâinile înainte să atingi peștele.</li><li>Ține peștele cât mai puțin afară din apă.</li><li>Folosește clește/extractor și evită rănirea inutilă.</li><li>Lasă peștele să își revină în apă înainte de eliberare.</li></ul><p>Regulile legale se verifică la zi din surse oficiale înainte de fiecare partidă.</p></div>`}
    ];

    function renderPartnersList() {
      state.page = 'partners';

      const content = `
        ${backHeader('Parteneri')}

        <div class="page-head">
          <div>
            <h1>Parteneri</h1>
            <p>Magazine, bălți și servicii pentru pescari.</p>
          </div>
        </div>

        <div class="stack">
          ${state.partners?.length
            ? state.partners.map(partnerCard).join('')

    function partnerCard(partner) {
      const image =
        Array.isArray(partner.images) && partner.images[0]
          ? partner.images[0]
          : 'assets/icon-512.png';

      return `
        <article
          class="partner-card"
          role="button"
          aria-label="Deschide ${esc(partner.name)}"
          onclick="App.openPartner('${partner.id}')"
        >
          <img
            class="partner-thumb"
            loading="lazy"
            decoding="async"
            src="${esc(image)}"
            alt="${esc(partner.name)}"
          >

          <div>
            <div class="row" style="justify-content:space-between">
              <strong>${esc(partner.name)}</strong>
              <span class="partner-plan">${esc(partner.plan)}</span>
            </div>

            <p class="muted" style="margin:4px 0 0;font-size:11px">
              ${esc(partner.partner_type)}
              ${partner.address ? ' · ' + esc(partner.address) : ''}
            </p>

            <button
              class="heart-btn ${partner.liked ? 'liked' : ''}"
              onclick="event.stopPropagation();App.togglePartnerLike('${partner.id}')"
            >
              ${partner.liked ? '♥' : '♡'}
              ${partner.likes_count || 0}
              <small>Apreciază</small>
            </button>
          </div>
        </article>
      `;
    }

    async function openPartners() {
      state.previous = state.page === 'partner' ? 'home' : state.page;
      state.page = 'partners';

      if (state.partners?.length) {
        renderPartnersList();
      } else {
        $('root').innerHTML = appShell(`
          ${backHeader('Parteneri')}
          <div class="loading-card">Se sincronizează...</div>
        `, 'home');
      }

      try {
        const data = await requireOk('api_get_partners', {
          p_token: state.token
        });

        const freshPartners = data.items || [];
        const changed = !sameJson(freshPartners, state.partners);
        state.partners = freshPartners;

        if (changed && state.page === 'partners') {
          renderPartnersList();
        }
      } catch (error) {
        if (!state.partners?.length) {
          toast(error.message);
        }
      }
    }

    function renderPartnerDetail(partner) {
      state.page = 'partner';
      state.currentPartner = partner;

      const images =
        Array.isArray(partner.images) && partner.images.length
          ? partner.images
          : ['assets/icon-512.png'];

      state.detailImages = images;
      state.detailIndex = 0;

      const gallery = `
        <div
          class="gallery"
          ontouchstart="App.galleryTouchStart(event)"
          ontouchend="App.galleryTouchEnd(event)"
        >
          <img
            id="galleryImg"
            class="gallery-img"
            src="${esc(images[0])}"
            alt="${esc(partner.name)}"
          >

          ${images.length > 1 ? `
            <button class="gallery-btn left" onclick="App.galleryPrev()">‹</button>
            <button class="gallery-btn right" onclick="App.galleryNext()">›</button>

            <div class="gallery-dots" id="galleryDots">
              ${images.map((_, index) => `
                <span class="gallery-dot ${index === 0 ? 'active' : ''}"></span>
              `).join('')}
            </div>
          ` : ''}
        </div>
      `;

      const content = `
        ${backHeader('Partener')}

        ${gallery}

        <div class="card pad" style="margin-top:9px">
          <div class="row" style="justify-content:space-between">
            <div>
              <h2 style="margin:0;font-size:20px">${esc(partner.name)}</h2>
              <p class="muted" style="margin:3px 0 0;font-size:11px">
                ${esc(partner.partner_type)}
              </p>
            </div>

            <span class="partner-plan">${esc(partner.plan)}</span>
          </div>

          ${partner.address ? `
            <p style="margin:12px 0 0">
              <strong>Adresă:</strong> ${esc(partner.address)}
            </p>
          ` : ''}

          <p>${esc(partner.description || 'Fără descriere.')}</p>

          <button
            class="heart-btn ${partner.liked ? 'liked' : ''}"
            onclick="App.togglePartnerLike('${partner.id}', true)"
          >
            ${partner.liked ? '♥' : '♡'}
            ${partner.likes_count || 0}
            <small>Apreciază</small>
          </button>

          <div class="row" style="margin-top:12px">
            ${partner.phone ? `
              <a class="btn secondary small" href="tel:${esc(partner.phone)}">
                Sună
              </a>
            ` : ''}

            ${partner.email ? `
              <a class="btn secondary small" href="mailto:${esc(partner.email)}">
                Email
              </a>
            ` : ''}

            ${partner.website ? `
              <a
                class="btn secondary small"
                href="${esc(partner.website)}"
                target="_blank"
              >
                Website
              </a>
            ` : ''}
          </div>
        </div>
      `;

      $('root').innerHTML = appShell(content, 'home');
    }

    async function openPartner(id) {
      const localPartner = (state.partners || []).find(item => item.id === id);

      state.previous = 'partners';
      state.page = 'partner';

      if (localPartner) {
        renderPartnerDetail(localPartner);
      } else {
        $('root').innerHTML = appShell(`
          ${backHeader('Partener')}
          <div class="loading-card">Se deschide...</div>
        `, 'home');
      }

      try {
        const data = await requireOk('api_get_partner', {
          p_token: state.token,
          p_partner_id: id
        });

        if (data.item) {
          const previousPartner = state.currentPartner;
          const changed = !sameJson(previousPartner, data.item);

          state.currentPartner = data.item;

          const existingIndex = state.partners.findIndex(item => item.id === id);

          if (existingIndex >= 0) {
            state.partners[existingIndex] = {
              ...state.partners[existingIndex],
              ...data.item
            };
          }

          if (changed && state.page === 'partner' && state.currentPartner.id === id) {
            renderPartnerDetail(data.item);
          }
        }
      } catch (error) {
        if (!localPartner) {
          toast(error.message);
        }
      }
    }

    async function togglePartnerLike(id, reopen=false) {
      const partner =
        (state.partners || []).find(item => item.id === id) ||
        state.currentPartner;

      if (partner) {
        partner.liked = !partner.liked;
        partner.likes_count = Math.max(
          0,
          (partner.likes_count || 0) + (partner.liked ? 1 : -1)
        );

        if (reopen) {
          renderPartnerDetail(partner);
        } else if (state.page === 'partners') {
          renderPartnersList();
        }
      }

      try {
        const data = await requireOk('api_toggle_partner_like', {
          p_token: state.token,
          p_partner_id: id
        });

        if (partner) {
          partner.liked = data.liked;
          partner.likes_count = data.likes_count;
        }
      } catch (error) {
        if (partner) {
          partner.liked = !partner.liked;
          partner.likes_count = Math.max(
            0,
            (partner.likes_count || 0) + (partner.liked ? 1 : -1)
          );
        }

        toast(error.message);
      }
    }

    async function openAdmin(tab='overview') {
      if (state.user.role !== 'admin') {
        toast('Acces interzis.');
        return;
      }

      state.previous = 'profile';
      state.page = 'admin';

      const tabs = [
        ['overview', 'General'],
        ['reports', 'Rapoarte'],
        ['partners', 'Parteneri'],
        ['users', 'Users'],
        ['messages', 'Mesaje']
      ];

      $('root').innerHTML = appShell(`
        ${backHeader('Panou Administrator')}

        <div class="tabs">
          ${tabs.map(([key, label]) => `
            <button
              class="tab ${key === tab ? 'active' : ''}"
              onclick="App.openAdmin('${key}')"
            >
              ${label}
            </button>
          `).join('')}
        </div>

        <div id="adminBody">
          <div class="loading-card">Se sincronizează...</div>
        </div>
      `, 'profile');

      try {
        if (tab === 'overview') return adminOverview();
        if (tab === 'reports') return adminReports();
        if (tab === 'partners') return adminPartners();
        if (tab === 'users') return adminUsers();
        if (tab === 'messages') return adminMessages();
      } catch (error) {
        toast(error.message);
      }
    }

    async function adminOverview(){const d=await requireOk('api_admin_overview',{p_token:state.token});$('adminBody').innerHTML=`<div class="admin-stat">${[['Membri',d.members],['Activi',d.active],['Capturi',d.catches],['Raportări noi',d.reports_new],['Parteneri activi',d.partners_active],['Expiră curând',d.partners_expiring]].map(s=>`<div class="stat"><strong>${s[1]}</strong><span>${s[0]}</span></div>`).join('')}</div>`;}
    async function adminReports(){const d=await requireOk('api_admin_list_reports',{p_token:state.token});$('adminBody').innerHTML=d.items.length?`<div class="stack">${d.items.map(r=>`<div class="card pad"><div class="row" style="justify-content:space-between"><div><strong>${esc(r.target_type)}</strong><p class="muted">${esc(r.reason)}</p></div><span class="status">${esc(r.status)}</span></div><p class="muted">Reporter: ${esc(r.reporter?.name||'—')} · ${fmtDateTime(r.created_at)}</p><div class="row"><button class="btn secondary small" onclick="App.openReportedSource('${r.target_type}','${r.target_id}')">Deschide sursa</button>${r.target_type==='catch'?`<button class="btn danger small" onclick="App.adminModerateReport('${r.id}','delete_catch')">Șterge postarea</button>`:''}<button class="btn small" onclick="App.adminModerateReport('${r.id}','keep')">Păstrează</button></div></div>`).join('')}</div>`:'<div class="empty card">Nu sunt raportări.</div>';}
    function openReportedSource(type,id){if(type==='catch')return App.openCatch(id);if(type==='profile')return App.openProfile(id);if(type==='partner')return App.openPartner(id);toast('Sursă necunoscută.');}
    async function adminModerateReport(id,action){try{await requireOk('api_admin_moderate_report',{p_token:state.token,p_report_id:id,p_action:action,p_note:''});toast('Raport actualizat.');openAdmin('reports');}catch(e){toast(e.message);}}
    async function updateReport(id,status){try{await requireOk('api_admin_update_report',{p_token:state.token,p_report_id:id,p_status:status,p_note:''});toast('Raportare actualizată.');openAdmin('reports');}catch(e){toast(e.message);}}
    async function adminUsers(){const d=await requireOk('api_admin_list_users',{p_token:state.token});$('adminBody').innerHTML=`<div class="stack">${(d.items||[]).map(u=>`<div class="card pad admin-user"><div><div class="admin-card-title">${esc(u.name)}</div><p class="muted">${esc(u.email)} · PIN: ${esc(u.pin_code||u.pin||'—')}</p><p class="muted">${esc(u.location||'Locație necompletată')}</p></div><div class="admin-actions"><span class="status ${u.is_blocked?'expirat':'activ'}">${u.is_blocked?'Blocat':'Activ'}</span><button class="btn secondary small" onclick="App.adminBlock('${u.id}',${!u.is_blocked})">${u.is_blocked?'Deblochează':'Blochează'}</button></div></div>`).join('')}</div>`;}
    async function adminBlock(id,block){try{await requireOk('api_admin_set_user_block',{p_token:state.token,p_user_id:id,p_block:block});toast('Utilizator actualizat.');openAdmin('users');}catch(e){toast(e.message);}}
    async function adminPartners(){const d=await requireOk('api_admin_list_partners',{p_token:state.token});$('adminBody').innerHTML=`<div class="card pad"><h3 style="margin-top:0">Adaugă partener</h3><div class="form-grid"><input id="paName" class="field" placeholder="Nume partener"><input id="paLinked" class="field" placeholder="Email cont asociat"><div class="grid2"><select id="paType" class="field"><option value="magazin">Magazin</option><option value="balta">Baltă</option><option value="pensiune">Pensiune</option><option value="producator">Producător</option></select><select id="paPlan" class="field" onchange="App.updatePartnerPlanHint()"><option value="basic">Basic · 3 poze</option><option value="plus">Plus · 6 poze</option><option value="premium">Premium · 10 poze</option></select></div><p id="paHint" class="muted">Plan Basic: maximum 3 poze.</p><input id="paExp" class="field" type="date"><textarea id="paDesc" placeholder="Descriere"></textarea><details><summary>Date opționale</summary><div class="form-grid" style="margin-top:10px"><input id="paAddress" class="field" placeholder="Adresă"><input id="paPhone" class="field" placeholder="Telefon"><input id="paEmail" class="field" placeholder="Email public"><input id="paWebsite" class="field" placeholder="Website"><input id="paFacebook" class="field" placeholder="Facebook"><input id="paInstagram" class="field" placeholder="Instagram"></div></details><input id="paImages" class="field" type="file" accept="image/*" multiple onchange="App.previewPartnerFiles()"><div id="paPreview" class="preview-grid"></div><button class="btn" onclick="App.adminAddPartner()">Adaugă partener</button></div></div><div class="section-title"><h2>Parteneri administrați</h2></div>${d.items.length?`<div class="stack">${d.items.map(p=>`<div class="card pad"><div class="row" style="justify-content:space-between"><strong>${esc(p.name)}</strong><span class="status ${esc(p.status)}">${esc(p.status)}</span></div><p class="muted">Cont asociat: ${p.linked_user?esc(p.linked_user.email):'—'} · Expiră: ${fmtDate(p.expires_at)}</p><div class="row"><button class="btn secondary small" onclick="App.openPartner('${p.id}')">Vezi</button><button class="btn secondary small" onclick="App.partnerStatus('${p.id}','activ')">Activ</button><button class="btn secondary small" onclick="App.partnerStatus('${p.id}','expirat')">Expirat</button><button class="btn danger small" onclick="App.partnerDelete('${p.id}')">Șterge logic</button></div></div>`).join('')}</div>`:'<div class="empty card">Nu ai parteneri.</div>'}`;}
    function updatePartnerPlanHint(){const p=$('paPlan')?.value||'basic';const max=partnerPhotoLimit(p);if($('paHint'))$('paHint').textContent=`Plan ${p}: maximum ${max} poze.`;}
    function previewPartnerFiles(){const max=partnerPhotoLimit($('paPlan').value);previewFiles($('paImages'),'paPreview',max);}
    async function adminAddPartner(){try{const max=partnerPhotoLimit($('paPlan').value);const files=[...$('paImages').files].slice(0,max);const urls=[];for(const f of files){urls.push(await imageFileToDataUrl(f,980,.70,false));}await requireOk('api_admin_add_partner',{p_token:state.token,p_linked_email:$('paLinked').value,p_name:$('paName').value,p_partner_type:$('paType').value,p_plan:$('paPlan').value,p_status:'activ',p_description:$('paDesc').value,p_address:$('paAddress').value,p_phone:$('paPhone').value,p_email:$('paEmail').value,p_website:$('paWebsite').value,p_facebook:$('paFacebook').value,p_instagram:$('paInstagram').value,p_images:urls,p_expires_at:$('paExp').value?$('paExp').value+'T23:59:59':null});toast('Partener adăugat.');openAdmin('partners');}catch(e){toast(e.message);}}
    async function partnerStatus(id,status){try{await requireOk('api_admin_update_partner_status',{p_token:state.token,p_partner_id:id,p_status:status,p_expires_at:null});toast('Status actualizat.');openAdmin('partners');}catch(e){toast(e.message);}}
    async function partnerDelete(id){if(!confirm('Ștergere logică partener?'))return;try{await requireOk('api_admin_delete_partner',{p_token:state.token,p_partner_id:id});toast('Partener arhivat.');openAdmin('partners');}catch(e){toast(e.message);}}
    function adminMessages(){$('adminBody').innerHTML=`<div class="card pad"><div class="form-grid"><input id="msgEmail" class="field" placeholder="Email utilizator"><input id="msgTitle" class="field" placeholder="Titlu mesaj"><textarea id="msgBody" placeholder="Mesaj oficial Pescar.ro"></textarea><button class="btn" onclick="App.adminSendMsg()">Trimite în Inbox</button></div></div>`;}
    async function adminSendMsg(){try{await requireOk('api_admin_send_message',{p_token:state.token,p_user_email:$('msgEmail').value,p_title:$('msgTitle').value,p_body:$('msgBody').value});toast('Mesaj trimis.');}catch(e){toast(e.message);}}

    
    function blobToDataURL(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Nu am putut citi poza.'));r.readAsDataURL(blob);});}
    async function imageFileToDataUrl(file,max=1280,quality=.76,square=false){const blob=await compressImage(file,max,quality,square);return await blobToDataURL(blob);}

    async function compressImage(file,max=1280,quality=.76,square=false){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{let sx=0,sy=0,sw=img.width,sh=img.height;if(square){const s=Math.min(sw,sh);sx=(sw-s)/2;sy=(sh-s)/2;sw=sh=s;}let w=sw,h=sh;if(square){w=h=max;}else if(Math.max(w,h)>max){const r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.drawImage(img,sx,sy,sw,sh,0,0,w,h);canvas.toBlob(b=>b?resolve(b):reject(new Error('Compresia imaginii a eșuat.')),'image/webp',quality);};img.onerror=()=>reject(new Error('Imagine invalidă.'));img.src=URL.createObjectURL(file);});}
    async function uploadBlob(bucket,blob,prefix){const path=`${state.user.id}/${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}.webp`;const res=await fetch(`${SUPABASE_URL}/storage/v1/object/${bucket}/${path}`,{method:'POST',headers:{...headers(false),'Content-Type':'image/webp','x-upsert':'true'},body:blob});if(!res.ok){const txt=await res.text();throw new Error('Upload eșuat: '+txt.slice(0,120));}return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${path}`;}
    async function deletePublicFile(url){try{const m=url.match(/\/storage\/v1\/object\/public\/([^\/]+)\/(.+)$/);if(!m)return;await fetch(`${SUPABASE_URL}/storage/v1/object/${m[1]}/${m[2]}`,{method:'DELETE',headers:headers(false)});}catch(e){console.warn(e);}}
    function previewFiles(input,id,max){const files=[...input.files].slice(0,max);if(input.files.length>max)toast(`Maximum ${max} poze.`);$(id).innerHTML=files.map(f=>`<img src="${URL.createObjectURL(f)}">`).join('');}
    async function logout(){try{await rpc('api_logout',{p_token:state.token});}catch{}localStorage.removeItem('pescar_token');state.token='';state.user=null;renderAuth();}
    function install(){if(!state.deferredInstall)return;state.deferredInstall.prompt();state.deferredInstall=null;render();}
    function dismissInstall(){state.deferredInstall=null;render();}
    function render(){ if(!state.user) renderAuth(); else go(state.page||'home'); }

    window.App={init,setAuth,login,register,pinClamp,searchRegisterLocation,selectRegisterLocation,go,back,loadHome,openCatch,galleryNext,galleryPrev,galleryTouchStart,galleryTouchEnd,shareCatch,report,resetFilters,loadMyCatches,deleteCatch,renderAdd,captureSlotPreview,submitCatch,renderWeather,useMyWeatherLocation,loadWeather,loadWeatherByCoords,renderProfile,openEditProfile,openChangeLocation,searchChangeLocation,saveLocation,saveProfile,openProfile,blockUser,openBlocked,unblockUser,openInbox,openXp,openLeaderboard,openGuide,openGuideArticle,openHelp,openContact,openRules,openTerms,openAbout,openPartners,openAdmin,updateReport,adminBlock,adminAddPartner,partnerStatus,partnerDelete,adminSendMsg,previewFiles,renderCatchDetail,openEditCatch,saveCatch,adminDeleteCatch,togglePartnerLike,openReportedSource,adminModerateReport,updatePartnerPlanHint,previewPartnerFiles,renderProfileLocal,refreshProfileView,renderPartnersList,renderPartnerDetail,renderInbox,silentRefresh,refreshHomeSilently,renderMyCatchesInstant,refreshMyCatchesSilently,partnerCard,patchHomeFeed,logout,install,dismissInstall};
    App.init();
  </script>

<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06325e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Pescar.ro" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/favicon-64.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <title>Pescar.ro</title>
  
<style>
  :root {
    --bg: #f3f7fa;
    --surface: #ffffff;
    --surface-soft: #eef5f8;
    --surface-blue: #eaf5fb;
    --ink: #081b2d;
    --muted: #738295;
    --blue: #075f98;
    --blue-dark: #073c63;
    --cyan: #0aa6c8;
    --green: #188856;
    --red: #d13d48;
    --amber: #d68a15;
    --line: rgba(8, 27, 45, .075);
    --shadow: 0 10px 30px rgba(7, 35, 61, .075);
    --shadow-strong: 0 20px 48px rgba(7, 42, 75, .15);
    --topbar-h: 68px;
    --nav-h: 72px;
    --radius: 20px;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
  }

  body {
    overflow-x: hidden;
    overscroll-behavior-y: none;
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
    touch-action: manipulation;
  }

  button {
    border: 0;
    cursor: pointer;
  }

  button:active,
  .feed-card:active,
  .partner-card:active,
  .guide-card:active,
  .menu-item:active {
    transform: scale(.985);
  }

  img {
    display: block;
    max-width: 100%;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  .hide {
    display: none !important;
  }

  .muted {
    color: var(--muted);
  }

  .app {
    min-height: 100dvh;
    background:
      radial-gradient(circle at 80% -10%, rgba(10, 166, 200, .10), transparent 28%),
      linear-gradient(180deg, #f8fbfd 0%, var(--bg) 60%, #eef4f7 100%);
  }

  .screen {
    width: 100%;
    max-width: 620px;
    margin: 0 auto;
    padding:
      calc(var(--topbar-h) + env(safe-area-inset-top) + 12px)
      12px
      calc(var(--nav-h) + env(safe-area-inset-bottom) + 22px);
  }

  .center {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 22px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .stack {
    display: grid;
    gap: 9px;
  }

  .grid2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
  }

  .form-grid {
    display: grid;
    gap: 10px;
  }

  #splash {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 50% 15%, rgba(10, 166, 200, .14), transparent 30%),
      #f6fafc;
    transition: opacity .16s ease;
  }

  .splash-card {
    width: min(76vw, 430px);
    background: transparent;
  }

  .splash-logo {
    width: 100%;
    filter: drop-shadow(0 12px 24px rgba(7, 48, 80, .10));
  }

  .loader-line {
    width: 48%;
    height: 3px;
    margin: 18px auto 0;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(7, 95, 152, .10);
  }

  .loader-line span {
    display: block;
    width: 42%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--blue), var(--cyan));
    animation: loader 1s linear infinite;
  }

  @keyframes loader {
    from { transform: translateX(-120%); }
    to { transform: translateX(250%); }
  }

  .netbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding: calc(env(safe-area-inset-top) + 8px) 12px 8px;
    background: #071c2e;
    color: #fff;
    text-align: center;
    font-size: 12px;
    font-weight: 850;
  }

  .topbar {
    position: fixed;
    inset: 0 0 auto;
    z-index: 40;
    height: calc(var(--topbar-h) + env(safe-area-inset-top));
    padding-top: env(safe-area-inset-top);
    background: rgba(248, 251, 253, .94);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(8, 27, 45, .045);
  }

  .topbar-inner {
    width: 100%;
    max-width: 620px;
    height: var(--topbar-h);
    margin: 0 auto;
    padding: 0 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    padding: 0;
    background: transparent;
  }

  .brand-logo {
    width: 106px;
    max-height: 42px;
    object-fit: contain;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .header-icon {
    width: 39px;
    height: 39px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    background: var(--surface-soft);
    color: var(--blue);
    font-weight: 900;
    position: relative;
  }

  .header-avatar {
    width: 39px;
    height: 39px;
    border-radius: 9px;
    object-fit: contain;
    background: transparent;
  }

  .inbox-dot {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ef3340;
    border: 2px solid #fff;
  }

  .nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 45;
    padding: 6px 9px calc(6px + env(safe-area-inset-bottom));
    background: transparent;
    pointer-events: none;
  }

  .nav-inner {
    width: 100%;
    max-width: 570px;
    height: 62px;
    margin: 0 auto;
    padding: 4px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    border: 1px solid rgba(8, 27, 45, .055);
    border-radius: 23px;
    background: rgba(255, 255, 255, .97);
    box-shadow: 0 16px 42px rgba(7, 35, 61, .14);
    backdrop-filter: blur(22px);
    pointer-events: auto;
  }

  .nav-btn {
    min-width: 0;
    height: 52px;
    padding: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    border-radius: 17px;
    background: transparent;
    color: #8492a2;
  }

  .nav-btn b {
    font-size: 19px;
    line-height: 20px;
  }

  .nav-btn span {
    font-size: 9.5px;
    font-weight: 850;
  }

  .nav-btn.active {
    background: #eaf4f9;
    color: var(--blue);
  }

  .nav-btn.add {
    background: linear-gradient(145deg, var(--blue-dark), #0b86b0);
    color: #fff;
  }

  .nav-btn.add b {
    font-size: 24px;
  }

  .page-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    margin: 5px 3px 12px;
  }

  .page-head h1,
  .page-head h2 {
    margin: 0;
    font-size: 24px;
    letter-spacing: -.04em;
  }

  .page-head p {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }

  .backbar {
    min-height: 42px;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .backbar h2 {
    margin: 0;
    font-size: 18px;
    letter-spacing: -.025em;
  }

  .back {
    height: 35px;
    padding: 0 11px;
    border-radius: 11px;
    background: #e8f2f7;
    color: var(--blue);
    font-size: 12px;
    font-weight: 900;
  }

  .card {
    overflow: hidden;
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }

  .pad {
    padding: 14px;
  }

  .quick-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 7px;
  }

  .quick-card {
    min-height: 72px;
    padding: 11px;
    border-radius: 17px;
    background: var(--surface);
    box-shadow: 0 6px 18px rgba(7, 35, 61, .055);
  }

  .quick-card strong {
    display: block;
    font-size: 15px;
    font-weight: 900;
  }

  .quick-card span {
    display: block;
    margin-top: 3px;
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 750;
  }

  .section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 17px 3px 9px;
  }

  .section-title h2 {
    margin: 0;
    font-size: 18px;
    letter-spacing: -.025em;
  }

  .field,
  textarea,
  select {
    width: 100%;
    border: 1px solid transparent;
    border-radius: 14px;
    outline: none;
    background: #f1f5f7;
    color: var(--ink);
    padding: 12px 13px;
    box-shadow: none;
  }

  textarea {
    min-height: 96px;
    resize: vertical;
  }

  .field:focus,
  textarea:focus,
  select:focus {
    background: #fff;
    border-color: rgba(7, 95, 152, .24);
  }

  .btn {
    min-height: 42px;
    padding: 10px 14px;
    border-radius: 14px;
    background: linear-gradient(145deg, var(--blue-dark), var(--blue));
    color: #fff;
    font-weight: 900;
  }

  .btn.secondary {
    background: #eaf3f8;
    color: var(--blue);
  }

  .btn.danger {
    background: #fff0f1;
    color: #b72d38;
  }

  .btn.small {
    min-height: 34px;
    padding: 8px 10px;
    border-radius: 11px;
    font-size: 12px;
  }

  .home-welcome {
    position: relative;
    overflow: hidden;
    padding: 18px;
    border-radius: 27px;
    background:
      radial-gradient(circle at 95% 5%, rgba(255,255,255,.17), transparent 28%),
      linear-gradient(145deg, #073759 0%, #075f98 64%, #0a9fbe 100%);
    color: #fff;
    box-shadow: var(--shadow-strong);
  }

  .home-welcome h1 {
    margin: 0;
    font-size: 27px;
    font-weight: 900;
    letter-spacing: -.045em;
  }

  .home-welcome p {
    margin: 6px 0 0;
    max-width: 330px;
    color: rgba(255,255,255,.76);
    font-size: 12px;
    font-weight: 750;
  }

  .home-stats {
    margin-top: 14px;
    display: flex;
    gap: 7px;
  }

  .home-stat {
    min-width: 88px;
    padding: 8px 10px;
    border-radius: 15px;
    background: rgba(255,255,255,.13);
  }

  .home-stat strong {
    display: block;
    font-size: 18px;
  }

  .home-stat span {
    color: rgba(255,255,255,.70);
    font-size: 10px;
    font-weight: 800;
  }

  .action-strip {
    margin: 10px 0 4px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

    min-width: 0;

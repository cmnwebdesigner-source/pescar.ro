<body>
  <div id="netbar" class="netbar hide">Nu ai conexiune la internet. Modul offline este limitat.</div>
  <div id="splash"><div class="splash-card"><img class="splash-logo" src="assets/logo-loading.webp" alt="Pescar.ro"><div class="loader-line"><span></span></div></div></div>
  <div id="root"></div>
  <div id="toast" class="toast hide"></div>
  <script>
    const REST_URL = 'https://avqkyhcdxszdwuudscym.supabase.co/rest/v1/';
    const PUBLIC_KEY = 'sb_publishable_WNnq6AxfgXRbxWY8zsOw-A_iNULRo7M';
    const SUPABASE_URL = REST_URL.replace('/rest/v1/', '');
    const VERSION = '1.2.0';
    const LEVELS = [
      [0,'Începător'],[500,'Ucenic Pescar'],[1500,'Pescar'],[3500,'Pescar Priceput'],[7000,'Pescar Avansat'],[12000,'Pescar Experimentat'],[20000,'Expert'],[32000,'Maestru Pescar'],[50000,'Veteran'],[80000,'Legendă Pescar.ro']
    ];
    const $ = (id)=>document.getElementById(id);
    const state = { token: localStorage.getItem('pescar_token') || '', user:null, stats:{members:0,active:0}, unread:0, page:'home', previous:'home', authMode:'login', feed:[], myCatches:[], records:[], partners:[], inbox:[], leaderboard:[], blocked:[], xp:[], deferredInstall:null, filterLoc:'', filterSpec:'' };

    function esc(v){return String(v ?? '').replace(/[&<>'"]/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[s]));}
    function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
    function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hide');setTimeout(()=>t.classList.add('hide'),3300);}
    function fmtDate(d){if(!d)return '—';return new Date(d).toLocaleDateString('ro-RO',{day:'2-digit',month:'short',year:'numeric'});}
    function fmtDateTime(d){if(!d)return '—';return new Date(d).toLocaleString('ro-RO',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}
    function levelInfo(xp){let idx=0;for(let i=0;i<LEVELS.length;i++){if(xp>=LEVELS[i][0]) idx=i;}const cur=LEVELS[idx], next=LEVELS[Math.min(idx+1,LEVELS.length-1)];const inLevel=xp-cur[0], need=Math.max(1,next[0]-cur[0]);return {level:idx+1,title:cur[1],nextTitle:next[1],cur:cur[0],next:next[0],pct:idx===LEVELS.length-1?100:Math.min(100,Math.round(inLevel/need*100)),left:Math.max(0,next[0]-xp)};}
    function avatar(u){return esc(u?.avatar_url || 'assets/icon-192.png');}
    function firstImage(item){return Array.isArray(item.images)&&item.images[0]?item.images[0]:'assets/icon-512.png';}
    function headers(json=true){const h={apikey:PUBLIC_KEY, Authorization:'Bearer '+PUBLIC_KEY}; if(json) h['Content-Type']='application/json'; return h;}
    async function rpc(fn,args={}){try{const res=await fetch(REST_URL+'rpc/'+fn,{method:'POST',headers:headers(true),body:JSON.stringify(args)});const data=await res.json().catch(()=>({ok:false,error:'Răspuns invalid.'}));if(!res.ok) throw new Error(data.message || data.error || 'Eroare Supabase.');return data;}catch(e){console.error(fn,e);throw e;}}
    async function requireOk(fn,args={}){const data=await rpc(fn,args); if(!data.ok) throw new Error(data.error||'Operațiunea a eșuat.'); return data;}

    function appShell(content, active='home'){
      return `<div class="app">
        <header class="topbar"><div class="topbar-inner">
          <button class="brand" onclick="App.go('home')" aria-label="Acasă"><img class="brand-logo" src="assets/logo-header.webp" alt="Pescar.ro"></button>
          <div class="header-actions">
            <button class="pill" onclick="App.openPartners()">Parteneri</button>
            <button class="icon-btn" onclick="App.openInbox()">✉${state.unread?`<span class="inbox-dot"></span>`:''}</button>
            <button class="icon-btn" onclick="App.go('profile')"><img class="avatar" src="${avatar(state.user)}" alt="Profil"></button>
          </div>
        </div></header>
        <main class="screen">${content}</main>
        <nav class="nav"><div class="nav-inner">
          ${navBtn('home','⌂','Acasă',active)}${navBtn('catches','◉','Capturi',active)}${navBtn('add','+','Adaugă',active,true)}${navBtn('weather','☁','Vreme',active)}${navBtn('profile','●','Profil',active)}
        </div></nav>
      </div>${installBanner()}`;
    }
    function navBtn(page,icon,label,active,add=false){return `<button class="nav-btn ${active===page?'active':''} ${add?'add':''}" onclick="App.go('${page}')"><b>${icon}</b><span>${label}</span></button>`;}
    function backHeader(title){return `<div class="backbar"><button class="back" onclick="App.back()">‹</button><h2>${esc(title)}</h2></div>`;}
    function installBanner(){return state.deferredInstall?`<div class="install"><strong>Instalează Pescar.ro</strong><p>Adaugă aplicația pe ecranul principal ca PWA.</p><div class="row"><button class="btn small" onclick="App.install()">Instalează</button><button class="btn secondary small" onclick="App.dismissInstall()">Mai târziu</button></div></div>`:'';}
    function loadingShell(active='home',text='Se încarcă...'){$('root').innerHTML=appShell(`<div class="loading-card">${esc(text)}</div>`,active);}
    function runSoon(fn){setTimeout(fn,0);}

    async function init(){
      if('serviceWorker' in navigator){
        try{
          const hadController=!!navigator.serviceWorker.controller;
          const reg=await navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'});
          reg.update().catch(()=>{});
          // Verifica periodic daca service-worker.js s-a schimbat, fara cache-ul HTTP al browserului.
          setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
          if(hadController){
            let reloading=false;
            navigator.serviceWorker.addEventListener('controllerchange',()=>{
              if(reloading)return;
              reloading=true;
              location.reload();
            });
          }
        }catch(e){}
      }
      document.addEventListener('touchstart',()=>{}, {passive:true});
      window.addEventListener('online',()=>$('netbar').classList.add('hide'));
      window.addEventListener('offline',()=>$('netbar').classList.remove('hide'));
      if(!navigator.onLine) $('netbar').classList.remove('hide');
      window.addEventListener('beforeinstallprompt',e=>{e.preventDefault(); state.deferredInstall=e; render();});
      await sleep(1000);
      if(state.token){
        try{const me=await requireOk('api_me',{p_token:state.token}); hydrateMe(me); await loadHome(false);}
        catch(e){localStorage.removeItem('pescar_token'); state.token=''; renderAuth();}
      }else renderAuth();
      $('splash').style.opacity='0'; setTimeout(()=>$('splash').remove(),280);
    }
    function hydrateMe(me){state.user=me.user;state.unread=me.unread||0;state.stats=me.stats||{members:0,active:0};}

    function renderAuth(){
      $('root').innerHTML = `<div class="center"><div class="auth-card">
        <img class="auth-logo" src="assets/logo-loading.webp" alt="Pescar.ro">
        <div class="seg"><button class="${state.authMode==='login'?'active':''}" onclick="App.setAuth('login')">Conectare</button><button class="${state.authMode==='register'?'active':''}" onclick="App.setAuth('register')">Înregistrare</button></div>
        ${state.authMode==='login'?loginForm():registerForm()}
        <p class="muted" style="font-size:12px;text-align:center;margin:14px 0 0">Fără confirmare prin email. Emailul și PIN-ul nu pot fi schimbate.</p>
      </div></div>`;
    }
    function loginForm(){return `<div class="form-grid"><input id="loginEmail" class="field" type="email" placeholder="Email"><input id="loginPin" class="field" type="password" inputmode="numeric" maxlength="4" placeholder="PIN 4 cifre"><button class="btn" onclick="App.login()">Intră în aplicație</button></div>`;}
    function registerForm(){return `<div class="form-grid"><input id="regEmail" class="field" type="email" placeholder="Email"><input id="regName" class="field" placeholder="Nume afișat"><input id="regLocation" class="field" placeholder="Locație"><input id="regPin" class="field" type="password" inputmode="numeric" maxlength="4" placeholder="PIN 4 cifre"><button class="btn" onclick="App.register()">Creează cont</button></div>`;}

    async function login(){try{const d=await requireOk('api_login',{p_email:$('loginEmail').value,p_pin:$('loginPin').value});state.token=d.token;localStorage.setItem('pescar_token',d.token);hydrateMe(d);toast('Bine ai venit!');await loadHome();}catch(e){toast(e.message);}}
    async function register(){try{const pin=$('regPin').value;if(!/^\d{4}$/.test(pin)) return toast('PIN-ul trebuie să aibă exact 4 cifre.');const d=await requireOk('api_register',{p_email:$('regEmail').value,p_name:$('regName').value,p_pin:pin,p_location:$('regLocation').value});state.token=d.token;localStorage.setItem('pescar_token',d.token);hydrateMe(d);toast('Cont creat cu succes.');await loadHome();}catch(e){toast(e.message);}}
    function setAuth(m){state.authMode=m;renderAuth();}

    async function refreshMe(){const me=await requireOk('api_me',{p_token:state.token});hydrateMe(me);}
    async function go(page){state.previous=state.page;state.page=page;try{if(page==='add')return renderAdd(); if(page==='weather')return renderWeather(); if(page==='home'){loadingShell('home');return runSoon(()=>loadHome().catch(e=>toast(e.message)));} if(page==='catches'){loadingShell('catches');return runSoon(()=>loadMyCatches().catch(e=>toast(e.message)));} if(page==='profile'){loadingShell('profile');return runSoon(()=>renderProfile().catch(e=>toast(e.message)));}}catch(e){toast(e.message);}}
    function back(){go(state.previous||'home');}

    async function loadHome(reload=true){if(reload) await refreshMe(); const loc=$('fLoc')?.value ?? state.filterLoc ?? ''; const sp=$('fSpec')?.value ?? state.filterSpec ?? ''; state.filterLoc=loc; state.filterSpec=sp; const data=await requireOk('api_get_feed',{p_token:state.token,p_location_filter:loc,p_species_filter:sp,p_limit:30,p_offset:0});state.feed=data.items||[];renderHome();}
    function resetFilters(){state.filterLoc='';state.filterSpec='';loadHome();}
    function renderHome(){
      const hasFilters=(state.filterLoc||state.filterSpec);
      const content = `<section class="home-hero"><div class="home-hello"><div><h1>Fir întins, ${esc(state.user?.name||'pescar')}!</h1><span>Comunitatea ta de pescuit</span></div><img class="home-logo-small" src="assets/logo-loading.webp" alt="Pescar.ro"></div><div class="home-stats"><div class="home-stat"><strong>${state.stats.members||0}</strong><span>membri</span></div><div class="home-stat"><strong>${state.stats.active||0}</strong><span>activi</span></div></div></section>
      <div class="action-grid"><button class="action-card" onclick="App.go('add')"><b>＋</b><strong>Adaugă captură</strong><span>încarcă până la 3 poze</span></button><button class="action-card" onclick="App.go('weather')"><b>☁</b><strong>Vreme pescuit</strong><span>după locația ta</span></button><button class="action-card" onclick="App.openGuide()"><b>⌁</b><strong>Ghid Pescar</strong><span>momeli, nade, monturi</span></button><button class="action-card" onclick="App.openPartners()"><b>◆</b><strong>Parteneri</strong><span>magazine și bălți</span></button></div>
      <div class="filter-card"><div class="section-title" style="margin-top:0"><h2>Feed capturi</h2></div><div class="grid2"><div><label>Filtru locație</label><input id="fLoc" class="field" placeholder="ex. Brașov" value="${esc(state.filterLoc||'')}"></div><div><label>Filtru specie</label><input id="fSpec" class="field" placeholder="ex. crap" value="${esc(state.filterSpec||'')}"></div></div><div class="filter-actions"><button class="btn small" onclick="App.loadHome()">Aplică filtre</button><button class="btn secondary small" onclick="App.resetFilters()">Șterge filtre</button></div>${hasFilters?`<p class="muted" style="margin:10px 4px 0">Afișez doar capturile care se potrivesc filtrelor.</p>`:''}</div>
      ${state.feed.length?`<div class="grid2">${state.feed.map(captureCard).join('')}</div>`:`<div class="empty card">${hasFilters?'Nu există capturi pentru filtrele alese.':'Nu există capturi încă. Fii primul care publică!'}</div>`}`;
      $('root').innerHTML = appShell(content,'home');
    }
    function captureCard(c){return `<article class="feed-card"><img class="feed-img" src="${esc(firstImage(c))}" alt="Captură" onclick="App.openCatch('${c.id}')"><div class="feed-body"><div class="feed-title">${esc(c.species||'Specie necompletată')}</div><div class="feed-meta">${esc(c.weight_kg?c.weight_kg+' kg':'Greutate necompletată')}</div><div class="feed-meta">${esc(c.location||c.author?.location||'Locație necompletată')}</div><div class="feed-actions"><button class="mini" onclick="App.openProfile('${c.author.id}')">${esc(c.author.name)}</button><button class="mini" onclick="App.shareCatch('${c.id}')">Distribuie</button></div></div></article>`;}

    async function openCatch(id){try{const d=await requireOk('api_get_catch',{p_token:state.token,p_catch_id:id});state.previous=state.page;state.page='catch';const c=d.item;const imgs=Array.isArray(c.images)&&c.images.length?c.images:[firstImage(c)];$('root').innerHTML=appShell(`${backHeader('Detalii captură')}<div class="stack"><img class="detail-img" src="${esc(imgs[0])}" alt="Captură"><div class="card pad"><h2 style="margin:0">${esc(c.species||'Specie necompletată')}</h2><p class="muted">Prins de <button class="mini" onclick="App.openProfile('${c.author.id}')">${esc(c.author.name)}</button> · ${fmtDate(c.created_at)}</p><div class="quick-grid"><div class="quick-card"><strong>${esc(c.weight_kg?c.weight_kg+' kg':'—')}</strong><span>Greutate</span></div><div class="quick-card"><strong>${esc(c.length_cm?c.length_cm+' cm':'—')}</strong><span>Lungime</span></div><div class="quick-card"><strong>${esc(c.location||'—')}</strong><span>Locație</span></div><div class="quick-card"><strong>${c.catch_release?'Da':'Nu'}</strong><span>Catch & Release</span></div></div><p>${esc(c.description||'Fără descriere.')}</p><div class="row"><button class="btn secondary small" onclick="App.shareCatch('${c.id}')">Distribuie</button><button class="btn secondary small" onclick="App.report('catch','${c.id}')">Raportează</button></div></div></div>`,'home');}catch(e){toast(e.message);}}
    async function shareCatch(id){const text='Uite o captură pe Pescar.ro';try{if(navigator.share) await navigator.share({title:'Pescar.ro',text,url:location.href}); else {await navigator.clipboard.writeText(text+' '+location.href);toast('Link copiat.');}}catch{}}
    async function report(type,id){const reason=prompt('Motiv raportare:'); if(!reason) return; try{await requireOk('api_report',{p_token:state.token,p_target_type:type,p_target_id:id,p_reason:reason});toast('Raportarea a fost trimisă.');}catch(e){toast(e.message);}}

    async function loadMyCatches(){await refreshMe(); const [mine,records]=await Promise.all([requireOk('api_get_my_catches',{p_token:state.token}),requireOk('api_get_records',{p_token:state.token})]);state.myCatches=mine.items||[];state.records=records.items||[];renderMyCatches();}
    function renderMyCatches(){const content=`<div class="section-title"><h2>Capturile mele</h2><button class="btn small" onclick="App.go('add')">Adaugă</button></div><div class="quick-grid"><div class="quick-card"><strong>${state.myCatches.length}</strong><span>Capturi</span></div><div class="quick-card"><strong>${state.records.length}</strong><span>Specii</span></div><div class="quick-card"><strong>${esc(state.user.record_weight||0)} kg</strong><span>Record</span></div><div class="quick-card"><strong>${levelInfo(state.user.xp).level}</strong><span>Nivel</span></div></div><div class="section-title"><h2>Recorduri automate</h2></div>${state.records.length?`<div class="stack">${state.records.map(r=>`<div class="card pad"><strong>${esc(r.species)}</strong><p class="muted">Greutate: ${esc(r.max_weight_kg||'—')} kg · Lungime: ${esc(r.max_length_cm||'—')} cm</p></div>`).join('')}</div>`:'<div class="empty card">Recordurile apar automat după ce adaugi capturi.</div>'}<div class="section-title"><h2>Lista capturilor</h2></div>${state.myCatches.length?`<div class="grid2">${state.myCatches.map(c=>`<article class="feed-card"><img class="feed-img" src="${esc(firstImage(c))}" onclick="App.openCatch('${c.id}')"><div class="feed-body"><div class="feed-title">${esc(c.species||'Specie necompletată')}</div><div class="feed-meta">${fmtDate(c.created_at)}</div><div class="feed-actions"><button class="mini" onclick="App.openCatch('${c.id}')">Vezi</button><button class="mini" onclick="App.deleteCatch('${c.id}')">Șterge</button></div></div></article>`).join('')}</div>`:'<div class="empty card">Nu ai capturi publicate.</div>'}`;$('root').innerHTML=appShell(content,'catches');}
    async function deleteCatch(id){if(!confirm('Ștergi captura? Va fi arhivată prin ștergere logică.'))return;try{await requireOk('api_delete_catch',{p_token:state.token,p_catch_id:id});toast('Captură ștearsă.');loadMyCatches();}catch(e){toast(e.message);}}

    function renderAdd(){const content=`<div class="section-title"><h2>Adaugă captură</h2></div><div class="card pad"><div class="form-grid"><div class="upload-slots"><label class="upload-slot" id="slotWrap1" for="capImage1"><input id="capImage1" class="hidden-input" type="file" accept="image/*" onchange="App.captureSlotPreview(1)"><span class="plus">+</span><span class="slot-text">Poza 1</span></label><label class="upload-slot" id="slotWrap2" for="capImage2"><input id="capImage2" class="hidden-input" type="file" accept="image/*" onchange="App.captureSlotPreview(2)"><span class="plus">+</span><span class="slot-text">Poza 2</span></label><label class="upload-slot" id="slotWrap3" for="capImage3"><input id="capImage3" class="hidden-input" type="file" accept="image/*" onchange="App.captureSlotPreview(3)"><span class="plus">+</span><span class="slot-text">Poza 3</span></label></div><input id="capSpecies" class="field" placeholder="Specie (opțional)"><input id="capWeight" class="field" type="number" step="0.01" placeholder="Greutate kg (opțional)"><input id="capLength" class="field" type="number" step="0.1" placeholder="Lungime cm (opțional)"><input id="capLocation" class="field" placeholder="Locație (opțional)" value="${esc(state.user?.location||'')}"><textarea id="capDesc" placeholder="Descriere"></textarea><label class="switch"><input id="capCR" type="checkbox"> Catch & Release</label><button class="btn" onclick="App.submitCatch()">Publică captura</button></div></div>`;$('root').innerHTML=appShell(content,'add');}
    function captureSlotPreview(slot){const input=$('capImage'+slot),wrap=$('slotWrap'+slot);if(!input||!wrap)return;const file=input.files?.[0];wrap.classList.remove('filled');wrap.querySelectorAll('img').forEach(n=>n.remove());if(!file)return;const img=document.createElement('img');img.src=URL.createObjectURL(file);wrap.prepend(img);wrap.classList.add('filled');}
    function getCaptureFiles(){return [1,2,3].map(i=>$('capImage'+i)?.files?.[0]).filter(Boolean).slice(0,3);}
    async function submitCatch(){try{const files=getCaptureFiles();const urls=[];for(const f of files){urls.push(await imageFileToDataUrl(f,980,.70,false));}await requireOk('api_create_catch',{p_token:state.token,p_species:$('capSpecies').value,p_weight_kg:num($('capWeight').value),p_length_cm:num($('capLength').value),p_location:$('capLocation').value,p_description:$('capDesc').value,p_catch_release:$('capCR').checked,p_images:urls});toast('Captura a fost publicată.');go('catches');}catch(e){toast('Eroare captură: '+e.message);}}
    function num(v){return v===''||v==null?null:Number(v)}

    function renderWeather(){const saved=(state.user?.location||'').trim();const city=(saved && !/^rom[aâ]nia$/i.test(saved))?saved:'';const content=`<section class="weather-hero"><h2>Vreme pentru pescuit</h2><p>Alege localitatea sau folosește locația telefonului.</p></section><div class="weather-search"><div class="form-grid"><input id="weatherCity" class="field" placeholder="Scrie localitatea, ex. Brașov" value="${esc(city)}"><div class="row"><button class="btn" onclick="App.loadWeather()">Verifică vremea</button><button class="btn secondary" onclick="App.useMyWeatherLocation()">Folosește locația mea</button></div></div></div><div id="weatherResult" style="margin-top:12px"></div>`;$('root').innerHTML=appShell(content,'weather');if(city) setTimeout(()=>App.loadWeather(city),30);}
    async function useMyWeatherLocation(){if(!navigator.geolocation)return toast('Telefonul/browserul nu permite locația.');$('weatherResult').innerHTML='<div class="card pad">Caut locația ta...</div>';navigator.geolocation.getCurrentPosition(pos=>App.loadWeatherByCoords(pos.coords.latitude,pos.coords.longitude,'Locația mea'),err=>{$('weatherResult').innerHTML='<div class="card pad">Nu am primit permisiune pentru locație. Scrie localitatea manual.</div>';},{enableHighAccuracy:false,timeout:9000,maximumAge:600000});}
    async function loadWeather(prefill=''){const city=(typeof prefill==='string'&&prefill?prefill:$('weatherCity').value).trim();if($('weatherCity') && city) $('weatherCity').value=city;if(!city)return toast('Scrie localitatea.');$('weatherResult').innerHTML='<div class="card pad">Se actualizează vremea...</div>';try{const fetchOpts={cache:'no-store'};const g=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=ro&format=json`,fetchOpts).then(r=>r.json());if(!g.results?.length)throw new Error('Localitate negăsită. Scrie orașul/satul mai exact.');const p=g.results[0];return App.loadWeatherByCoords(p.latitude,p.longitude,`${p.name}, ${p.country_code||''}`);}catch(e){$('weatherResult').innerHTML=`<div class="card pad">${esc(e.message)}</div>`;}}
    async function loadWeatherByCoords(lat,lon,label='Locația mea'){try{const fetchOpts={cache:'no-store'};const w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,pressure_msl&daily=sunrise,sunset&timezone=auto`,fetchOpts).then(r=>r.json());const c=w.current;if(!c)throw new Error('Nu am putut actualiza vremea.');const advice=weatherAdvice(c);$('weatherResult').innerHTML=`<div class="card pad"><p class="weather-city">${esc(label)}</p><div class="weather-big">${c.temperature_2m}°C</div><div class="weather-update">Actualizat acum · date meteo live</div><div class="quick-grid"><div class="quick-card"><strong>${c.wind_speed_10m} km/h</strong><span>Vânt</span></div><div class="quick-card"><strong>${c.pressure_msl} hPa</strong><span>Presiune</span></div><div class="quick-card"><strong>${c.relative_humidity_2m}%</strong><span>Umiditate</span></div><div class="quick-card"><strong>${c.precipitation} mm</strong><span>Ploaie</span></div></div><p class="muted">Răsărit: ${new Date(w.daily.sunrise[0]).toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'})} · Apus: ${new Date(w.daily.sunset[0]).toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'})}</p></div><div class="card pad" style="margin-top:12px"><h2 style="margin-top:0">Sfat pentru pescuit</h2><p>${advice}</p></div>`;}catch(e){$('weatherResult').innerHTML=`<div class="card pad">${esc(e.message)}</div>`;}}
    function weatherAdvice(c){let a=[];if(c.wind_speed_10m>24)a.push('Vântul este mai puternic. Caută zone adăpostite și evită lansările lungi.');else a.push('Vântul este acceptabil pentru o partidă normală.');if(c.pressure_msl<1008)a.push('Presiunea este mai joasă, peștii pot fi mai activi, dar vremea se poate schimba.');if(c.temperature_2m>28)a.push('Pe căldură mare încearcă dimineața devreme sau seara.');if(c.precipitation>0)a.push('Ploaia ușoară poate fi bună, dar verifică siguranța zonei.');return a.join(' ');}

    async function renderProfile(){await refreshMe();const li=levelInfo(state.user.xp);const content=`<div class="profile-cover"><div class="profile-main"><img class="profile-avatar" src="${avatar(state.user)}"><div><div class="profile-name">${esc(state.user.name)}</div><div class="muted">${esc(state.user.location||'Locație necompletată')}</div><div class="status activ" style="margin-top:8px">Nivel ${li.level} · ${li.title}</div></div></div><div class="profile-stats"><div class="profile-stat"><strong>${state.user.catches_count||0}</strong><span>capturi</span></div><div class="profile-stat"><strong>${state.user.species_count||0}</strong><span>specii</span></div><div class="profile-stat"><strong>${esc(state.user.record_weight||0)} kg</strong><span>record</span></div></div><div class="levelbox" style="color:var(--ink)"><div class="row" style="justify-content:space-between"><strong>${state.user.xp} XP</strong><span class="muted">${li.left?li.left+' XP până la următorul nivel':'Nivel maxim'}</span></div><div class="bar"><span style="width:${li.pct}%"></span></div></div></div><div class="profile-section"><div class="section-title"><h2>Contul meu</h2></div><div class="menu-list"><button class="menu-item" onclick="App.openEditProfile()">Editează profilul <span>poză, nume, locație</span></button><button class="menu-item" onclick="App.openInbox()">Inbox Pescar.ro <span>${state.unread?'mesaje noi':'mesaje oficiale'}</span></button><button class="menu-item" onclick="App.openXp()">Istoric XP <span>taskuri finalizate</span></button><button class="menu-item" onclick="App.openLeaderboard()">Clasament <span>nivel și XP</span></button></div></div><div class="profile-section"><div class="section-title"><h2>Setări și ajutor</h2></div><div class="menu-list"><button class="menu-item" onclick="App.openBlocked()">Utilizatori blocați <span>gestionează</span></button><button class="menu-item" onclick="App.openHelp()">Ajutor / FAQ <span>întrebări</span></button><button class="menu-item" onclick="App.openContact()">Contact Pescar.ro <span>suport</span></button><button class="menu-item" onclick="App.openRules()">Reguli <span>comunitate</span></button><button class="menu-item" onclick="App.openTerms()">Termeni și Confidențialitate <span>legal</span></button><button class="menu-item" onclick="App.openAbout()">Despre Pescar.ro <span>v${VERSION}</span></button>${state.user.role==='admin'?'<button class="menu-item" onclick="App.openAdmin()">Panou Admin <span>administrator</span></button>':''}<button class="menu-item" onclick="App.logout()">Deconectare <span>ieși din cont</span></button></div></div>`;$('root').innerHTML=appShell(content,'profile');}
    function openEditProfile(){state.previous='profile';$('root').innerHTML=appShell(`${backHeader('Editează profilul')}<div class="card pad"><div class="form-grid"><label class="avatar-picker">Adaugă poză de profil<input id="avatarFile" type="file" accept="image/*"><span>Alege o imagine din telefon</span></label><input id="editName" class="field" value="${esc(state.user.name)}" placeholder="Nume afișat"><p class="muted" style="margin:0 4px">Numele afișat se poate schimba o singură dată la 15 zile.</p><input id="editLoc" class="field" value="${esc(state.user.location)}" placeholder="Localitate, ex. Brașov"><p class="muted" style="margin:0 4px">Emailul și PIN-ul rămân aceleași.</p><button class="btn" onclick="App.saveProfile()">Salvează profilul</button></div></div>`,'profile');}
    async function saveProfile(){try{let avatarUrl=null;const file=$('avatarFile').files[0];if(file){avatarUrl=await imageFileToDataUrl(file,512,.82,true);}const d=await requireOk('api_update_profile',{p_token:state.token,p_name:$('editName').value,p_location:$('editLoc').value,p_avatar_url:avatarUrl});state.user=d.user;toast('Profil salvat.');renderProfile();}catch(e){toast(e.message);}}

    async function openProfile(id){try{const d=await requireOk('api_get_public_profile',{p_token:state.token,p_user_id:id});state.previous=state.page;const p=d.profile;const cards=(d.catches||[]).map(c=>`<article class="feed-card"><img class="feed-img" src="${esc(firstImage(c))}" onclick="App.openCatch('${c.id}')"><div class="feed-body"><div class="feed-title">${esc(c.species||'Specie necompletată')}</div><div class="feed-meta">${fmtDate(c.created_at)}</div></div></article>`).join('');$('root').innerHTML=appShell(`${backHeader('Profil pescar')}<div class="profile-head"><div class="profile-main"><img class="profile-avatar" src="${avatar(p)}"><div><div class="profile-name">${esc(p.name)}</div><div class="muted">${esc(p.location||'România')}</div><div class="status">${p.catches_count||0} capturi · ${p.species_count||0} specii</div></div></div><div class="row" style="margin-top:14px"><button class="btn secondary small" onclick="App.report('profile','${p.id}')">Raportează</button><button class="btn danger small" onclick="App.blockUser('${p.id}')">Blochează</button></div></div><div class="section-title"><h2>Capturi publice</h2></div>${cards?`<div class="grid2">${cards}</div>`:'<div class="empty card">Nu are capturi publice.</div>'}`,'home');}catch(e){toast(e.message);}}
    async function blockUser(id){if(!confirm('Blochezi acest utilizator?'))return;try{await requireOk('api_block_user',{p_token:state.token,p_blocked_id:id});toast('Utilizator blocat.');loadHome();}catch(e){toast(e.message);}}
    async function openBlocked(){try{const d=await requireOk('api_get_blocked_users',{p_token:state.token});state.blocked=d.items||[];$('root').innerHTML=appShell(`${backHeader('Utilizatori blocați')}${state.blocked.length?`<div class="stack">${state.blocked.map(u=>`<div class="card pad row" style="justify-content:space-between"><div class="row"><img class="avatar" src="${avatar(u)}"><strong>${esc(u.name)}</strong></div><button class="btn secondary small" onclick="App.unblockUser('${u.id}')">Deblochează</button></div>`).join('')}</div>`:'<div class="empty card">Nu ai utilizatori blocați.</div>'}`,'profile');}catch(e){toast(e.message);}}

    function openTerms(){state.previous='profile';$('root').innerHTML=appShell(`${backHeader('Termeni și Confidențialitate')}<div class="card pad"><h3>Termeni și condiții</h3><p>Pescar.ro este o aplicație pentru pescari, capturi, vreme, ghid și parteneri. Utilizatorul este responsabil pentru conținutul publicat și pentru respectarea regulilor de pescuit.</p><h3>Confidențialitate</h3><p>Prelucrăm email, nume, locație, capturi, activitate, XP și mesaje oficiale pentru funcționarea aplicației. Emailul și PIN-ul nu sunt publice.</p><p>Textele complete se pot extinde înainte de lansarea oficială.</p></div>`,'profile');}

    async function openAdmin(tab='overview'){if(state.user.role!=='admin')return toast('Acces interzis.');state.previous='profile';const tabs=['overview','reports','partners','users','messages'];let body='<div class="card pad">Se încarcă...</div>';$('root').innerHTML=appShell(`${backHeader('Panou Admin')}<div class="tabs">${tabs.map(t=>`<button class="tab ${t===tab?'active':''}" onclick="App.openAdmin('${t}')">${t}</button>`).join('')}</div><div id="adminBody" style="margin-top:12px">${body}</div>`,'profile');try{if(tab==='overview')return adminOverview();if(tab==='reports')return adminReports();if(tab==='partners')return adminPartners();if(tab==='users')return adminUsers();if(tab==='messages')return adminMessages();}catch(e){toast(e.message);}}
    async function adminOverview(){const d=await requireOk('api_admin_overview',{p_token:state.token});$('adminBody').innerHTML=`<div class="admin-stat">${[['Membri',d.members],['Activi',d.active],['Capturi',d.catches],['Raportări noi',d.reports_new],['Parteneri activi',d.partners_active],['Expiră curând',d.partners_expiring]].map(s=>`<div class="stat"><strong>${s[1]}</strong><span>${s[0]}</span></div>`).join('')}</div>`;}

    async function updateReport(id,status){try{await requireOk('api_admin_update_report',{p_token:state.token,p_report_id:id,p_status:status,p_note:''});toast('Raportare actualizată.');openAdmin('reports');}catch(e){toast(e.message);}}
    async function adminUsers(){const d=await requireOk('api_admin_list_users',{p_token:state.token});$('adminBody').innerHTML=`<div class="stack">${(d.items||[]).map(u=>`<div class="card pad"><div class="row" style="justify-content:space-between"><div><strong>${esc(u.name)}</strong><p class="muted">${esc(u.email)} · PIN: ${esc(u.pin_code||u.pin||'—')} · ${esc(u.location)}</p></div><span class="status ${u.is_blocked?'expirat':'activ'}">${u.is_blocked?'Blocat':'Activ'}</span></div><button class="btn secondary small" onclick="App.adminBlock('${u.id}',${!u.is_blocked})">${u.is_blocked?'Deblochează':'Blochează'}</button></div>`).join('')}</div>`;}
    async function adminBlock(id,block){try{await requireOk('api_admin_set_user_block',{p_token:state.token,p_user_id:id,p_block:block});toast('Utilizator actualizat.');openAdmin('users');}catch(e){toast(e.message);}}
    async function adminPartners(){const d=await requireOk('api_admin_list_partners',{p_token:state.token});$('adminBody').innerHTML=`<div class="card pad"><h3>Adaugă partener</h3><div class="form-grid"><input id="paName" class="field" placeholder="Nume partener"><input id="paLinked" class="field" placeholder="Email cont asociat (intern)"><select id="paType" class="field"><option value="magazin">Magazin</option><option value="balta">Baltă</option><option value="pensiune">Pensiune</option><option value="producator">Producător</option></select><select id="paPlan" class="field"><option value="basic">Basic - 29 lei/lună</option><option value="plus">Plus - 59 lei/lună</option><option value="premium">Premium - 99 lei/lună</option></select><input id="paExp" class="field" type="date" placeholder="Expiră la"><textarea id="paDesc" placeholder="Descriere"></textarea><input id="paAddress" class="field" placeholder="Adresă"><input id="paPhone" class="field" placeholder="Telefon"><input id="paEmail" class="field" placeholder="Email public"><input id="paWebsite" class="field" placeholder="Website"><input id="paFacebook" class="field" placeholder="Facebook"><input id="paInstagram" class="field" placeholder="Instagram"><input id="paImages" class="field" type="file" accept="image/*" multiple onchange="App.previewFiles(this,'paPreview',5)"><div id="paPreview" class="preview-grid"></div><button class="btn" onclick="App.adminAddPartner()">Adaugă partener</button></div></div><div class="section-title"><h2>Parteneri administrați</h2></div>${d.items.length?`<div class="stack">${d.items.map(p=>`<div class="card pad"><div class="row" style="justify-content:space-between"><strong>${esc(p.name)}</strong><span class="status ${esc(p.status)}">${esc(p.status)}</span></div><p class="muted">Cont asociat: ${p.linked_user?esc(p.linked_user.email):'—'} · Expiră: ${fmtDate(p.expires_at)}</p><div class="row"><button class="btn secondary small" onclick="App.partnerStatus('${p.id}','activ')">Activ</button><button class="btn secondary small" onclick="App.partnerStatus('${p.id}','expirat')">Expirat</button><button class="btn danger small" onclick="App.partnerDelete('${p.id}')">Șterge logic</button></div></div>`).join('')}</div>`:'<div class="empty card">Nu ai parteneri.</div>'}`;}
    async function adminAddPartner(){try{const files=[...$('paImages').files].slice(0,5);const urls=[];for(const f of files){urls.push(await imageFileToDataUrl(f,980,.70,false));}await requireOk('api_admin_add_partner',{p_token:state.token,p_linked_email:$('paLinked').value,p_name:$('paName').value,p_partner_type:$('paType').value,p_plan:$('paPlan').value,p_status:'activ',p_description:$('paDesc').value,p_address:$('paAddress').value,p_phone:$('paPhone').value,p_email:$('paEmail').value,p_website:$('paWebsite').value,p_facebook:$('paFacebook').value,p_instagram:$('paInstagram').value,p_images:urls,p_expires_at:$('paExp').value?$('paExp').value+'T23:59:59':null});toast('Partener adăugat.');openAdmin('partners');}catch(e){toast(e.message);}}

    function adminMessages(){$('adminBody').innerHTML=`<div class="card pad"><div class="form-grid"><input id="msgEmail" class="field" placeholder="Email utilizator"><input id="msgTitle" class="field" placeholder="Titlu mesaj"><textarea id="msgBody" placeholder="Mesaj oficial Pescar.ro"></textarea><button class="btn" onclick="App.adminSendMsg()">Trimite în Inbox</button></div></div>`;}

    function blobToDataURL(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Nu am putut citi poza.'));r.readAsDataURL(blob);});}
    async function imageFileToDataUrl(file,max=1280,quality=.76,square=false){const blob=await compressImage(file,max,quality,square);return await blobToDataURL(blob);}

    async function compressImage(file,max=1280,quality=.76,square=false){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{let sx=0,sy=0,sw=img.width,sh=img.height;if(square){const s=Math.min(sw,sh);sx=(sw-s)/2;sy=(sh-s)/2;sw=sh=s;}let w=sw,h=sh;if(square){w=h=max;}else if(Math.max(w,h)>max){const r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.drawImage(img,sx,sy,sw,sh,0,0,w,h);canvas.toBlob(b=>b?resolve(b):reject(new Error('Compresia imaginii a eșuat.')),'image/webp',quality);};img.onerror=()=>reject(new Error('Imagine invalidă.'));img.src=URL.createObjectURL(file);});}
    async function uploadBlob(bucket,blob,prefix){const path=`${state.user.id}/${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}.webp`;const res=await fetch(`${SUPABASE_URL}/storage/v1/object/${bucket}/${path}`,{method:'POST',headers:{...headers(false),'Content-Type':'image/webp','x-upsert':'true'},body:blob});if(!res.ok){const txt=await res.text();throw new Error('Upload eșuat: '+txt.slice(0,120));}return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${path}`;}
    async function deletePublicFile(url){try{const m=url.match(/\/storage\/v1\/object\/public\/([^\/]+)\/(.+)$/);if(!m)return;await fetch(`${SUPABASE_URL}/storage/v1/object/${m[1]}/${m[2]}`,{method:'DELETE',headers:headers(false)});}catch(e){console.warn(e);}}
    function previewFiles(input,id,max){const files=[...input.files].slice(0,max);if(input.files.length>max)toast(`Maximum ${max} poze.`);$(id).innerHTML=files.map(f=>`<img src="${URL.createObjectURL(f)}">`).join('');}
    async function logout(){try{await rpc('api_logout',{p_token:state.token});}catch{}localStorage.removeItem('pescar_token');state.token='';state.user=null;renderAuth();}
    function install(){if(!state.deferredInstall)return;state.deferredInstall.prompt();state.deferredInstall=null;render();}
    function dismissInstall(){state.deferredInstall=null;render();}
    function render(){ if(!state.user) renderAuth(); else go(state.page||'home'); }
